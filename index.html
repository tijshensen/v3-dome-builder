<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trillium 5/8 3v — Hex panel frames</title>
  <style>
    :root {
      --bg: #121418;
      --panel: #1c2028;
      --line: #2e3542;
      --text: #e8eaed;
      --muted: #9aa3b2;
      --hex: #3d8bfd;
      --pent: #f0a202;
      --wood: #c48a4a;
      --accent: #7dcea0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
    #c { display: block; width: 100%; height: 100%; }
    .ui {
      position: absolute; top: 12px; left: 12px; width: min(380px, calc(100% - 24px));
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
      backdrop-filter: blur(8px); max-height: calc(100% - 24px); overflow: auto;
    }
    h1 { font-size: 15px; margin: 0 0 8px; font-weight: 650; }
    h2 { font-size: 12px; margin: 12px 0 6px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    button {
      background: #2a3140; color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit;
    }
    button:hover:not(:disabled) { border-color: #4a5568; }
    button.active { background: #3a5a8a; border-color: var(--hex); }
    button.secondary { opacity: 0.45; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    .step { width: 100%; text-align: left; font-size: 12px; padding: 5px 8px; }
    .dims { color: var(--muted); font-size: 12px; white-space: pre-wrap; margin: 6px 0 0; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .hint a { color: var(--accent); }
    .legend span { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
    .cutbox {
      background: #161a22; border: 1px solid var(--line); border-radius: 8px;
      padding: 8px 10px; font-size: 12px; color: var(--muted); white-space: pre-wrap;
      margin-top: 4px;
    }
    .navrow { display: flex; gap: 6px; align-items: center; margin: 8px 0; }
    .navrow .spacer { flex: 1; color: var(--muted); font-size: 12px; text-align: center; }
    .badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 999px; background: #2a3140; color: var(--muted); margin-left: 4px; }
    .machinesetup {
      background: #161a22; border: 1px solid var(--hex); border-radius: 8px;
      padding: 8px 10px; margin-top: 8px; font-size: 12px;
    }
    .machinesetup .ms-title {
      font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--hex); margin: 0 0 6px;
    }
    .machinesetup .ms-tools { color: var(--text); font-weight: 600; margin: 0 0 4px; }
    .machinesetup ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); }
    .machinesetup li { margin: 2px 0; }
    .machine-hud {
      position: absolute; right: 12px; top: 12px; width: min(280px, calc(100% - 420px));
      background: #1c2028ee; border: 2px solid #3d8bfd; border-radius: 12px; padding: 10px 12px;
      pointer-events: none; z-index: 5;
    }
    .machine-hud[hidden] { display: none !important; }
    .machine-hud .mh-brand { font: 700 14px/1.25 system-ui; margin: 0 0 6px; }
    .machine-hud.dewalt { border-color: #f5c518; }
    .machine-hud.dewalt .mh-brand { color: #f5c518; }
    .machine-hud.makita { border-color: #1a8f8a; }
    .machine-hud.makita .mh-brand { color: #2ec4b6; }
    .machine-hud ul { margin: 0; padding-left: 16px; color: var(--muted); font-size: 12px; }
    .machine-hud li { margin: 2px 0; }
    .vizrow { display: none; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    .vizrow.show { display: flex; }
    .split-chrome {
      /* Full viewport; divider at 50% aligns with world X=0 (MATERIALS | MACHINE). */
      position: absolute; inset: 0; pointer-events: none; z-index: 3;
    }
    .split-chrome[hidden] { display: none !important; }
    .split-divider {
      position: absolute; left: 50%; top: 8%; bottom: 8%; width: 2px;
      transform: translateX(-50%);
      background: color-mix(in srgb, #d7dde8 75%, var(--line));
      box-shadow: 0 0 0 1px #00000066;
    }
    .split-label {
      position: absolute; top: 14px;
      font: 700 11px/1 system-ui; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line);
      background: #1c2028cc;
    }
    .split-label-left {
      /* Sit in left pane but clear of the UI card */
      left: max(28%, calc(var(--split-left, 404px) + 12%));
      transform: translateX(-50%);
      color: var(--wood); border-color: #6a4a2a;
    }
    .split-label-right {
      left: 72%; transform: translateX(-50%);
      color: #f5c518; border-color: #f5c518;
    }
    .split-chrome.makita .split-label-right { color: #2ec4b6; border-color: #1a8f8a; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="ui">
    <h1>Trillium 5/8 3v — Hex panel frames</h1>
    <div class="row">
      <button id="btnHex" class="active" type="button">Hex ×73</button>
      <button id="btnPent" class="secondary" type="button" disabled title="Pent polish paused until Hex passes review">Pent ×30</button>
      <button id="btnDoor" class="secondary" type="button" disabled title="Door polish paused until Hex passes review">Door half</button>
    </div>
    <div class="row">
      <button id="uIN" class="active" type="button">in</button>
      <button id="uMM" type="button">mm</button>
      <button id="btnReset" type="button">Reset view</button>
    </div>
    <div class="row vizrow" id="vizrow">
      <button id="vizMachine" class="active" type="button" title="Split: materials left · machine right">Machine</button>
      <button id="vizWood" type="button" title="Materials / jig only (left focus)">Wood</button>
    </div>
    <div class="row" id="steps"></div>
    <div class="dims" id="dims"></div>
    <div class="machinesetup" id="machinesetup" aria-live="polite"></div>
    <h2>Hex cut counts</h2>
    <div class="cutbox" id="cutlist"></div>
    <div class="hint">
      Drag orbit · scroll zoom · right-drag pan<br>
      <span class="legend"><span style="background:#c48a4a"></span>strut</span>
      <span class="legend"><span style="background:#5b3a1e"></span>6.5° bevel</span>
      <span class="legend"><span style="background:#7dcea0"></span>jig</span>
      <span class="legend"><span style="background:#f5c518"></span>DWE7492</span>
      <span class="legend"><span style="background:#1a8f8a"></span>LS1019L</span>
      <span class="legend"><span style="background:#f0a202"></span>stop</span><br>
      Panel shell: <a href="./assembly.html">assembly guide</a><br>
      Steps follow <a href="https://youtu.be/Sl9fEp-27EM" target="_blank" rel="noopener">this panel-build video</a>
      + Trillium plan dimensions (PDF p5 / cross-section p7).
      <span class="badge">Hex review</span>
    </div>
  </div>
  <div id="machineHud" class="machine-hud" hidden aria-live="polite"></div>
  <div id="splitChrome" class="split-chrome" hidden aria-hidden="true">
    <div class="split-divider"></div>
    <div class="split-label split-label-left">Materials</div>
    <div class="split-label split-label-right">Machine</div>
  </div>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module">

    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
    import {
      HEX,
      STRUT_H,
      STOCK_W,
      STRUT_W,
      STRUT_H_IN,
      STOCK_W_IN,
      STRUT_W_IN,
      BEVEL_DEG,
      BEVEL_RAD,
      BLANK_LEN,
      FULL_2X6_W,
      PLAN_IN,
      TOOL_TABLE_SAW,
      TOOL_MITER_SAW
    } from './panel/panel-specs.js';

    // Locked dims live in panel/panel-specs.js (single source of truth).
    const BEVEL = BEVEL_RAD;

    const STEPS = [
      {
        id: 0,
        title: '1. Cut blanks',
        text: () => `Longest hex side is ${fmt(HEX.a)}. Cut strut blanks ~${fmt(BLANK_LEN)} for handling. Batch: ${HEX.qty} panels × 3 = ${HEX.qty * 3} strut blanks.`,
        view: 'blanks',
        machineVisual: 'miterCrosscut',
        machineSetup: {
          machines: () => `${TOOL_MITER_SAW} (prefer) · or hand saw`,
          settings: () => [
            `Prefer ${TOOL_MITER_SAW} for crosscutting blanks to ~${fmt(BLANK_LEN)}`,
            'Use a stop block for repeat blank length on the miter saw',
            'No bevel / no compound for this step'
          ]
        }
      },
      {
        id: 1,
        title: '2. Rip stock',
        text: () => `On the DEWALT DWE7492 table saw: rip 2×6 in half → ${fmt(STRUT_H)} × ${fmt(STOCK_W)}. Keep pairs matched so both halves stay the same size. Rip capacity is fine for ~${fmt(BLANK_LEN)} blanks.`,
        view: 'stock',
        machineVisual: 'tableRip',
        machineSetup: {
          machines: () => TOOL_TABLE_SAW,
          settings: () => [
            'Blade square: 90° / 0° bevel (no tilt)',
            `Fence: half of 2×6 → ${fmt(STRUT_H)} × ${fmt(STOCK_W)}`,
            'Use a push stick; keep matched pairs'
          ]
        }
      },
      {
        id: 2,
        title: '3. Optional finish',
        text: () => `Optional (video workflow): finish or stain stock before the final bevel rip so you coat the wide faces while they are still flat.`,
        view: 'stock',
        machineVisual: 'none',
        machineSetup: {
          machines: () => 'None / hand tools only',
          settings: () => [
            'No saw setup for this step',
            'Finish or stain flat faces before the bevel rip'
          ]
        }
      },
      {
        id: 3,
        title: '4. Lay out hex jig',
        text: () => `${units === 'mm' ? '19 mm' : '¾"'} plywood larger than the panel. Draw a straight base; mark ends ${fmt(HEX.c)} apart. From each mark, swing arcs at ${fmt(HEX.a)} (compass or screw+string). Apex = arc intersection. Connect the three points.`,
        view: 'jig',
        machineVisual: 'handLayout',
        machineSetup: {
          machines: () => 'None / hand tools only',
          settings: () => [
            'No saw — measuring / compass (or screw+string) only',
            `Base marks ${fmt(HEX.c)} apart; arcs at ${fmt(HEX.a)}`
          ]
        }
      },
      {
        id: 4,
        title: '5. Rip 6.5° bevel',
        text: () => `On the DEWALT DWE7492: matched bevel-rip (second rip) a ${BEVEL_DEG}° bevel on one long edge. The ${BEVEL_DEG}° sets the taper only; set the fence so finished face width is ${fmt(STRUT_W)} (PDF p7) — ${fmt(STRUT_H)}×${fmt(STOCK_W)} → ${fmt(STRUT_H)}×${fmt(STRUT_W)} comes from that fence setting, not from the angle alone. Both halves same size; keep the first strut as fence/template. Bevel faces outward. On this saw’s 0–45° bevel scale (0° = square/vertical), set ${BEVEL_DEG}° directly. (EU 90-based scales only: ~83.5°.)`,
        view: 'bevel',
        machineVisual: 'tableBevel',
        machineSetup: {
          machines: () => TOOL_TABLE_SAW,
          settings: () => [
            `Bevel: set ${BEVEL_DEG}° on DWE7492 0–45° scale (0° = square)`,
            `Fence for finished face ${fmt(STRUT_W)} (${STRUT_W} mm)`,
            'Keep first strut as fence / template; matched pairs; bevel faces out',
            'Note: EU 90-based scales only → ~83.5°'
          ]
        }
      },
      {
        id: 5,
        title: '6. Finish jig stops',
        text: () => `Place struts wide-face down on the jig lines. Add backing stops so each strut edge just splits the layout line.`,
        view: 'jigStops',
        machineVisual: 'none',
        machineSetup: {
          machines: () => 'None / hand tools only',
          settings: () => [
            'No saw setup for this step',
            'Backing stops only — strut edge splits the layout line'
          ]
        }
      },
      {
        id: 6,
        title: '7. Initial miters',
        text: () => `On the MAKITA LS1019L (dual-bevel slider + laser): simple miters (not compound), long-point to long-point, cut close to the end. Per panel: two @ ${HEX.base}° (bases) + one @ ${HEX.apex}° (apex), off 90°. Miter 0–60° covers both; the ~31.6° stop is close — dial fine to ${HEX.apex}° with scale/laser, do not trust the stop alone. Use a stop block for repeat Hex blanks. First-end batch: ${HEX.qty * 2} × ${HEX.base}° and ${HEX.qty} × ${HEX.apex}°. Check reciprocal overlap on the jig.`,
        view: 'miters',
        machineVisual: 'miterSimple',
        machineSetup: {
          machines: () => TOOL_MITER_SAW,
          settings: () => [
            'Bevel 0° (simple miter, not compound)',
            `Miter ${HEX.base}° (bases) or ${HEX.apex}° (apex) off 90°`,
            `Dial ${HEX.apex}° — do not trust the ~31.6° stop alone`,
            'Stop block; cut close to the end; long-point to long-point'
          ]
        }
      },
      {
        id: 7,
        title: '8. Compound trim ears',
        text: () => `Prefer the MAKITA LS1019L for compound ear trim: same miter + ${BEVEL_DEG}° bevel (dual bevel 0–48° L/R — no flip for opposite bevels). Use a stop block. Hand saw only if needed. Check fit every 5–10 struts.`,
        view: 'ears',
        machineVisual: 'miterCompound',
        machineSetup: {
          machines: () => `${TOOL_MITER_SAW} (prefer) · hand saw only if needed`,
          settings: () => [
            `Same miter as step 7 + ${BEVEL_DEG}° bevel (compound)`,
            'Dual bevel L/R — no flip for opposite bevels',
            'Stop block; check fit every 5–10 struts'
          ]
        }
      },
      {
        id: 8,
        title: '9. Assemble',
        text: () => `Predrill if needed; two screws per corner; bevels out. QA: a symmetrical hex should flip on the jig and sit snug both ways.`,
        view: 'assemble',
        machineVisual: 'drill',
        machineSetup: {
          machines: () => 'Drill / driver (no saw)',
          settings: () => [
            'No saw angles for this step',
            'Predrill if needed; two screws per corner; bevels out'
          ]
        }
      },
      {
        id: 9,
        title: '10. Done / counts',
        text: () => `Panel complete. Full dome: ${HEX.qty} hex panels including 4 windows. Sides ${fmt(HEX.a)} / ${fmt(HEX.b)} / base ${fmt(HEX.c)}; miters ${HEX.apex}° apex + ${HEX.base}° / ${HEX.base}°.`,
        view: 'done',
        machineVisual: 'none',
        machineSetup: {
          machines: () => 'None / no saw',
          settings: () => [
            'No saw setup — panel complete',
            'Brief reminder: DWE7492 for rips/bevel; LS1019L for miters/ears'
          ]
        }
      }
    ];

    const _qs = new URLSearchParams(location.search);
    let step = Math.max(0, Math.min(STEPS.length - 1, parseInt(_qs.get('step') || '0', 10) || 0));
    let units = 'in'; // imperial primary for Hex review
    if (_qs.get('pause') === '1') window.__pause = true;

    const canvas = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = false;

    const labelRenderer = new CSS2DRenderer();
    labelRenderer.domElement.style.position = 'absolute';
    labelRenderer.domElement.style.top = '0';
    labelRenderer.domElement.style.left = '0';
    labelRenderer.domElement.style.pointerEvents = 'none';
    document.body.appendChild(labelRenderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121418);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 50);
    camera.position.set(1.6, 1.2, 2.2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.35, 0);

    scene.add(new THREE.HemisphereLight(0xc8d4e8, 0x2a2118, 1.1));
    const sun = new THREE.DirectionalLight(0xfff3e0, 1.4);
    sun.position.set(2, 3, 2);
    sun.castShadow = false;
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0xffffff, 0.25));

    const group = new THREE.Group();
    scene.add(group);

    const woodMat = new THREE.MeshStandardMaterial({ color: 0xc48a4a, roughness: 0.55, metalness: 0.02 });
    const bevelMat = new THREE.MeshStandardMaterial({ color: 0x5b3a1e, roughness: 0.5 });
    const jigMat = new THREE.MeshStandardMaterial({ color: 0x3d5c45, roughness: 0.8 });
    const markMat = new THREE.LineBasicMaterial({ color: 0x7dcea0 });
    const stainMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.45, metalness: 0.05 });

    function gcd(a, b) { return b ? gcd(b, a % b) : a; }

    function fmt(mm) {
      if (units === 'mm') return `${mm} mm`;
      if (PLAN_IN.has(mm)) return PLAN_IN.get(mm);
      const inches = mm / 25.4;
      const ft = Math.floor(inches / 12 + 1e-9);
      let inch = inches - ft * 12;
      const sixteenths = Math.round(inch * 16) / 16;
      const whole = Math.floor(sixteenths + 1e-9);
      let num = Math.round((sixteenths - whole) * 16);
      let den = 16;
      if (num === 16) { num = 0; }
      // Avoid invalid feet-inches like 3'-12"
      if (whole === 12) return `${ft + 1}'-0"`;
      const g = num ? gcd(num, den) : 1;
      const fracStr = num ? ` ${num / g}/${den / g}` : '';
      if (ft) return `${ft}'-${whole}${fracStr}"`;
      return `${whole}${fracStr}"`;
    }

    function planDual(mm, inStr) {
      if (units === 'mm') return `${mm} mm (${inStr})`;
      return `${inStr} (${mm} mm)`;
    }

    function triangleHeight(a, b, c) {
      const s = (a + b + c) / 2;
      const area = Math.sqrt(Math.max(0, s * (s - a) * (s - b) * (s - c)));
      return (2 * area) / c;
    }

    function makeLabel(text, pos) {
      const el = document.createElement('div');
      el.textContent = text;
      el.style.cssText = 'background:#1c2028cc;color:#e8eaed;padding:2px 6px;border-radius:4px;font:11px/1.2 system-ui;white-space:nowrap;border:1px solid #2e3542';
      const obj = new CSS2DObject(el);
      obj.position.copy(pos);
      return obj;
    }

    function strutMesh(lengthMm, faceWmm = STRUT_W, mat = woodMat) {
      const L = lengthMm / 1000;
      const h = STRUT_H / 1000;
      const w = faceWmm / 1000;
      const taper = Math.tan(BEVEL) * h;
      const shape = new THREE.Shape();
      shape.moveTo(0, 0);
      shape.lineTo(w, 0);
      shape.lineTo(Math.max(0.001, w - taper), h);
      shape.lineTo(0, h);
      shape.closePath();
      const geo = new THREE.ExtrudeGeometry(shape, { depth: L, bevelEnabled: false });
      geo.translate(-w / 2, 0, -L / 2);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function placeStrut(p1, p2, up, faceWmm = STRUT_W) {
      const a = p1.clone();
      const b = p2.clone();
      const dir = new THREE.Vector3().subVectors(b, a);
      const len = dir.length();
      const mid = a.clone().add(b).multiplyScalar(0.5);
      const mesh = strutMesh(len * 1000, faceWmm);
      mesh.position.copy(mid);
      const z = dir.clone().normalize();
      const x = new THREE.Vector3().crossVectors(up, z).normalize();
      const y = new THREE.Vector3().crossVectors(z, x).normalize();
      mesh.setRotationFromMatrix(new THREE.Matrix4().makeBasis(x, y, z));
      mesh.position.add(y.clone().multiplyScalar(STRUT_H / 2000));
      return mesh;
    }

    function hexPoints() {
      const a = HEX.a / 1000, b = HEX.b / 1000, c = HEX.c / 1000;
      const h = triangleHeight(HEX.a, HEX.b, HEX.c) / 1000;
      const pA = new THREE.Vector3(-c / 2, 0, 0);
      const pB = new THREE.Vector3(c / 2, 0, 0);
      const xApex = (a * a - b * b + c * c) / (2 * c);
      const pC = new THREE.Vector3(-c / 2 + xApex, 0, h);
      return { pA, pB, pC, h, c };
    }

    function addJig(pA, pB, pC, h, c, withStops) {
      const jig = new THREE.Mesh(new THREE.BoxGeometry(c + 0.2, 0.012, h + 0.2), jigMat);
      jig.position.set(0, -0.008, h / 2);
      jig.receiveShadow = true;
      woodTarget.add(jig);
      const outline = new THREE.BufferGeometry().setFromPoints([pA, pB, pC, pA]);
      const line = new THREE.Line(outline, markMat);
      line.position.y = 0.002;
      woodTarget.add(line);
      woodTarget.add(makeLabel(fmt(HEX.c), new THREE.Vector3(0, 0.05, -0.05)));
      woodTarget.add(makeLabel(fmt(HEX.a), new THREE.Vector3((pA.x + pC.x) / 2 - 0.08, 0.05, (pA.z + pC.z) / 2)));
      woodTarget.add(makeLabel(fmt(HEX.b), new THREE.Vector3((pB.x + pC.x) / 2 + 0.08, 0.05, (pB.z + pC.z) / 2)));
      if (withStops) {
        const stopMat = new THREE.MeshStandardMaterial({ color: 0x2a4a35, roughness: 0.7 });
        [[pA, pB], [pB, pC], [pC, pA]].forEach(([u, v]) => {
          const mid = u.clone().add(v).multiplyScalar(0.5);
          const stop = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.03, 0.08), stopMat);
          stop.position.copy(mid);
          stop.position.y = 0.01;
          woodTarget.add(stop);
        });
      }
    }

    // Brand colors — schematics must read as DWE7492 / LS1019L, not gray boxes
    const machineMat = new THREE.MeshStandardMaterial({ color: 0x6b8caf, roughness: 0.55, metalness: 0.25 });
    const dewaltYellow = new THREE.MeshStandardMaterial({ color: 0xf5c518, roughness: 0.42, metalness: 0.12 });
    const dewaltBlack = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.55, metalness: 0.22 });
    const dewaltGray = new THREE.MeshStandardMaterial({ color: 0x5a6068, roughness: 0.45, metalness: 0.4 });
    const makitaTeal = new THREE.MeshStandardMaterial({ color: 0x009b93, roughness: 0.4, metalness: 0.18 });
    const makitaDark = new THREE.MeshStandardMaterial({ color: 0x1a2424, roughness: 0.55, metalness: 0.15 });
    const makitaSilver = new THREE.MeshStandardMaterial({ color: 0xc5ced6, roughness: 0.32, metalness: 0.6 });
    const fenceMat = new THREE.MeshStandardMaterial({ color: 0x3d8bfd, roughness: 0.45, metalness: 0.15 });
    const bladeMat = new THREE.MeshStandardMaterial({ color: 0xd0d6de, roughness: 0.3, metalness: 0.65 });
    const stopMat = new THREE.MeshStandardMaterial({ color: 0xf0a202, roughness: 0.55, metalness: 0.1 });
    const noneMat = new THREE.MeshStandardMaterial({ color: 0x3a4250, roughness: 0.8 });
    const laserMat = new THREE.MeshStandardMaterial({
      color: 0xff3355, roughness: 0.4, metalness: 0.1, emissive: 0xaa1122, emissiveIntensity: 0.45
    });

    let vizMode = 'machine';
    // Saw steps: MATERIALS pane LEFT of divider, MACHINE pane RIGHT (match miters).
    let woodTarget = group;
    let machineTarget = group;
    const WOOD_SPLIT_X = -1.35;
    const MACHINE_SPLIT_X = 1.35;
    const matPadMat = new THREE.MeshStandardMaterial({ color: 0x2a3340, roughness: 0.9, metalness: 0.05 });

    function addMaterialsPad(w = 1.15, d = 1.2) {
      const pad = new THREE.Mesh(new THREE.BoxGeometry(w, 0.016, d), matPadMat);
      pad.position.set(0, -0.01, 0);
      woodTarget.add(pad);
      const rim = new THREE.Mesh(
        new THREE.BoxGeometry(w + 0.04, 0.006, d + 0.04),
        new THREE.MeshStandardMaterial({ color: 0x3d5c45, roughness: 0.85 })
      );
      rim.position.set(0, -0.02, 0);
      woodTarget.add(rim);
      return pad;
    }

    function addPaneFloor(target, x) {
      // Separate floor per pane — never one shared shop floor across the divider.
      const grid = new THREE.GridHelper(2.2, 10, 0x2a3140, 0x1a1e26);
      grid.position.set(x, -0.02, 0);
      target.add(grid);
    }

    function layoutSplitChrome() {
      const ui = document.querySelector('.ui');
      if (!ui) return;
      const left = Math.min(ui.getBoundingClientRect().right + 8, window.innerWidth * 0.45);
      document.documentElement.style.setProperty('--split-left', `${Math.max(0, left)}px`);
    }

    function hasSawVisual(kind) {
      return kind === 'tableRip' || kind === 'tableBevel' || kind === 'miterCrosscut'
        || kind === 'miterSimple' || kind === 'miterCompound';
    }

    function setMachineHud(brand, title, lines) {
      const el = document.getElementById('machineHud');
      if (!brand) {
        el.hidden = true;
        el.innerHTML = '';
        return;
      }
      el.hidden = false;
      el.className = 'machine-hud ' + (brand === 'dewalt' ? 'dewalt' : 'makita');
      const lis = (lines || []).map((l) => '<li>' + l + '</li>').join('');
      el.innerHTML = '<div class="mh-brand">' + title + '</div>' + (lis ? '<ul>' + lis + '</ul>' : '');
    }

    function arrowMesh(dir, color = 0x7dcea0) {
      const g = new THREE.Group();
      const shaft = new THREE.Mesh(
        new THREE.CylinderGeometry(0.01, 0.01, 0.28, 8),
        new THREE.MeshStandardMaterial({ color })
      );
      shaft.rotation.z = -Math.PI / 2;
      shaft.position.x = 0.14;
      const head = new THREE.Mesh(
        new THREE.ConeGeometry(0.025, 0.06, 10),
        new THREE.MeshStandardMaterial({ color })
      );
      head.rotation.z = -Math.PI / 2;
      head.position.x = 0.3;
      g.add(shaft, head);
      const d = dir.clone().normalize();
      const quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1, 0, 0), d);
      g.setRotationFromQuaternion(quat);
      return g;
    }

    /** DEWALT DWE7492 — photo cues; keep mesh count low for swiftshader */
    function addTableSawSchematic({ bevelDeg = 0, fenceFaceMm, stockWmm, stockHmm, label }) {
      const g = new THREE.Group();
      const tableY = 0.10;
      const bevelRad = (bevelDeg * Math.PI) / 180;
      const tableMat = new THREE.MeshStandardMaterial({ color: 0x8a9098, roughness: 0.4, metalness: 0.55 });
      const redMat = new THREE.MeshStandardMaterial({ color: 0xc62828, roughness: 0.45 });
      const greenMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.4 });
      const hairMat = new THREE.MeshStandardMaterial({ color: 0xe53935, roughness: 0.35, emissive: 0x881111, emissiveIntensity: 0.35 });
      const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf2f2f0, roughness: 0.55 });

      // yellow cabinet + black legs
      const cabinet = new THREE.Mesh(new THREE.BoxGeometry(1.02, 0.34, 0.58), dewaltYellow);
      cabinet.position.set(0, -0.08, -0.02); g.add(cabinet);
      [[-0.46, 0.30], [0.46, 0.30], [-0.46, -0.28], [0.46, -0.28]].forEach(([x, z]) => {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.5, 0.045), dewaltBlack);
        leg.position.set(x, -0.28, z); g.add(leg);
      });

      // front: red OFF, green ON, height wheel, bevel plate + pointer
      const faceZ = 0.28;
      const off = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.09, 0.02), redMat);
      off.position.set(-0.36, -0.06, faceZ); g.add(off);
      const on = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.012, 12), greenMat);
      on.rotation.x = Math.PI / 2; on.position.set(-0.36, 0.01, faceZ + 0.008); g.add(on);
      const hw = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.028, 16), dewaltBlack);
      hw.rotation.x = Math.PI / 2; hw.position.set(-0.08, -0.02, faceZ + 0.01); g.add(hw);
      const bevelPlate = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.05, 0.01), whiteMat);
      bevelPlate.position.set(0.22, -0.14, faceZ + 0.01); g.add(bevelPlate);
      const ptrX = 0.22 - 0.19 + (Math.min(45, Math.max(0, bevelDeg)) / 45) * 0.38;
      const ptr = new THREE.Mesh(new THREE.ConeGeometry(0.012, 0.028, 8), hairMat);
      ptr.rotation.x = Math.PI; ptr.position.set(ptrX, -0.11, faceZ + 0.02); g.add(ptr);

      // grey table + yellow throat + blade in YZ through slot
      const table = new THREE.Mesh(new THREE.BoxGeometry(1.22, 0.035, 0.76), tableMat);
      table.position.set(0, tableY, 0); g.add(table);
      const throat = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.01, 0.38), dewaltYellow);
      throat.position.set(0, tableY + 0.018, 0); g.add(throat);
      const throatSlot = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.014, 0.32), dewaltBlack);
      throatSlot.position.set(0, tableY + 0.02, 0); g.add(throatSlot);
      const bladeG = new THREE.Group();
      const blade = new THREE.Mesh(new THREE.CylinderGeometry(0.135, 0.135, 0.0035, 32), bladeMat);
      blade.rotation.z = Math.PI / 2; bladeG.add(blade);
      bladeG.rotation.z = -bevelRad; bladeG.position.set(0, tableY + 0.02, 0); g.add(bladeG);

      // rack-and-pinion rail + dual scale (yellow over white) + red hairline
      const railZ = 0.42;
      const rail = new THREE.Mesh(new THREE.BoxGeometry(1.28, 0.045, 0.06), makitaSilver);
      rail.position.set(0, tableY - 0.01, railZ); g.add(rail);
      const rack = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.01, 0.016), dewaltBlack);
      rack.position.set(0, tableY - 0.038, railZ + 0.01); g.add(rack);
      const scaleY = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.004, 0.022), dewaltYellow);
      scaleY.position.set(0.12, tableY + 0.016, railZ + 0.01); g.add(scaleY);
      const scaleW = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.004, 0.018), whiteMat);
      scaleW.position.set(0.12, tableY + 0.016, railZ + 0.028); g.add(scaleW);

      // fence RIGHT
      const fenceX = fenceFaceMm / 1000;
      const fence = new THREE.Mesh(new THREE.BoxGeometry(0.038, 0.22, 0.72), makitaSilver);
      fence.position.set(fenceX + 0.02, tableY + 0.13, 0); g.add(fence);
      const carriage = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.08, 0.08), dewaltBlack);
      carriage.position.set(fenceX + 0.02, tableY + 0.02, railZ + 0.02); g.add(carriage);
      const adj = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.04, 12), dewaltBlack);
      adj.rotation.x = Math.PI / 2; adj.position.set(fenceX + 0.06, tableY + 0.02, railZ + 0.06); g.add(adj);
      const hair = new THREE.Mesh(new THREE.BoxGeometry(0.002, 0.004, 0.05), hairMat);
      hair.position.set(fenceX + 0.02, tableY + 0.024, railZ + 0.005); g.add(hair);

      const w = stockWmm / 1000, h = stockHmm / 1000;
      const stock = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.85), woodMat);
      stock.position.set(fenceX - w / 2, tableY + 0.018 + h / 2, 0.02); g.add(stock);
      const arr = arrowMesh(new THREE.Vector3(0, 0, -1));
      arr.position.set(fenceX - w / 2, tableY + h + 0.08, 0.45); g.add(arr);

      const hud = [
        bevelDeg === 0 ? 'Blade square · bevel pointer 0° (0–45° scale)' : 'Bevel ' + bevelDeg + '° on 0–45° scale (0°=square)',
        'Fence → ' + fmt(fenceFaceMm) + ' (red hairline on dual scale)',
        'Yellow throat · blade through slot · fence RIGHT',
        'Rack & pinion · lock + adjust · red OFF / green ON',
        label || 'Workpiece on fence'
      ];
      if (bevelDeg > 0) hud.splice(1, 0, 'EU 90-based scales only → ~' + (90 - bevelDeg).toFixed(1) + '°');
      setMachineHud('dewalt', 'DEWALT DWE7492', hud);
      g.scale.setScalar(1.05); machineTarget.add(g); return g;
    }

    /** MAKITA LS1019L — teal head, twin rails, clear guard, silver turntable, teal kerf */
    function addMiterSawSchematic({ miterDeg = 0, bevelDeg = 0, bevelSide = 'L', stop = true, label, compound = false }) {
      const g = new THREE.Group();
      const miterRad = (miterDeg * Math.PI) / 180;
      const bevelRad = (bevelDeg * Math.PI) / 180;
      const kerfMat = new THREE.MeshStandardMaterial({ color: 0x1a8f8a, roughness: 0.45 });
      const guardMat = new THREE.MeshStandardMaterial({ color: 0x009b93, roughness: 0.35, transparent: true, opacity: 0.45 });

      const base = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.06, 0.55), makitaSilver);
      base.position.set(0, 0, 0.02); g.add(base);
      const turntable = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.38, 0.045, 32), makitaSilver);
      turntable.position.y = 0.05; g.add(turntable);
      const miterScale = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.008, 0.04), makitaSilver);
      miterScale.position.set(0.12, 0.075, 0.34); g.add(miterScale);
      const stop316 = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.012, 0.012), new THREE.MeshStandardMaterial({ color: 0xc62828 }));
      stop316.position.set(0.12 - 0.275 + (31.6 / 45) * 0.55, 0.085, 0.34); g.add(stop316);
      const mKnob = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.04, 0.06, 12), makitaDark);
      mKnob.rotation.x = Math.PI / 2; mKnob.position.set(0, 0.04, 0.42); g.add(mKnob);

      [-0.028, 0.028].forEach((x) => {
        const kp = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.01, 0.28), kerfMat);
        kp.position.set(x, 0.075, 0.04); g.add(kp);
      });
      const fenceL = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.2, 0.032), makitaSilver);
      fenceL.position.set(-0.24, 0.18, -0.14);
      const fenceR = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.2, 0.032), makitaSilver);
      fenceR.position.set(0.24, 0.18, -0.14);
      g.add(fenceL, fenceR);

      const arm = new THREE.Group();
      arm.rotation.y = -miterRad;
      [0.30, 0.40].forEach((y) => {
        const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.78, 12), makitaSilver);
        rail.rotation.x = Math.PI / 2; rail.position.set(-0.14, y, -0.05); arm.add(rail);
      });
      const motor = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.2, 0.28), makitaTeal);
      motor.position.set(0.02, 0.42, 0.22); arm.add(motor);
      const handle = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.018, 6, 16, Math.PI * 1.2), makitaTeal);
      handle.rotation.z = Math.PI / 2; handle.position.set(0.02, 0.56, 0.22); arm.add(handle);

      const bladeG = new THREE.Group();
      const blade = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.0035, 32), bladeMat);
      blade.rotation.z = Math.PI / 2; bladeG.add(blade);
      const guard = new THREE.Mesh(new THREE.CylinderGeometry(0.145, 0.145, 0.05, 20, 1, false, -0.2, Math.PI * 1.35), guardMat);
      guard.rotation.z = Math.PI / 2; guard.position.set(0.01, 0.02, 0); bladeG.add(guard);
      bladeG.rotation.z = bevelSide === 'R' ? bevelRad : -bevelRad;
      bladeG.position.set(0, 0.26, 0.08); arm.add(bladeG);
      g.add(arm);

      const blank = new THREE.Mesh(new THREE.BoxGeometry(0.55, STRUT_H / 1000, STOCK_W / 1000), woodMat);
      blank.position.set(0.05, 0.078 + STRUT_H / 2000, -0.02); g.add(blank);
      if (stop) {
        const sb = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.1, 0.07), stopMat);
        sb.position.set(-0.36, 0.12, -0.02); g.add(sb);
      }

      const hud = [];
      if (miterDeg === 0) hud.push('Miter 0° (crosscut)');
      else hud.push('Dial miter to ' + miterDeg + '° — not the 31.6° stop');
      hud.push(bevelDeg === 0 ? 'Bevel 0° (simple)' : 'Bevel ' + bevelDeg + '° ' + bevelSide);
      if (compound) hud.push('Dual bevel L/R — no flip');
      if (stop) hud.push('Stop block (orange)');
      if (label) hud.push(label);
      hud.push('Teal kerf · silver turntable · work on fence');
      setMachineHud('makita', 'MAKITA LS1019L', hud);
      g.scale.setScalar(1.1); machineTarget.add(g); return g;
    }

    function addNoMachineVisual(kind) {
      setMachineHud(null);
      const g = new THREE.Group();
      if (kind === 'handLayout') {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.008, 8, 48), fenceMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.set(0, 0.02, 0.35);
        g.add(ring);
        const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.25, 8), stopMat);
        stick.rotation.z = Math.PI / 2;
        stick.position.set(0.12, 0.03, 0.35);
        g.add(stick);
        g.add(makeLabel('no saw — compass / measure', new THREE.Vector3(0, 0.15, 0.35)));
      } else if (kind === 'drill') {
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.18), machineMat);
        body.position.set(0, 0.12, 0);
        g.add(body);
        const bit = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.1, 8), bladeMat);
        bit.position.set(0, 0.05, 0.12);
        g.add(bit);
        g.add(makeLabel('drill / driver — no saw', new THREE.Vector3(0, 0.25, 0)));
      } else {
        const badge = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.08, 0.02), noneMat);
        badge.position.set(0, 0.2, 0);
        g.add(badge);
        g.add(makeLabel('no machine / hand tools', new THREE.Vector3(0, 0.32, 0)));
      }
      woodTarget.add(g);
      return g;
    }

    function addMachineVisual(kind) {
      if (!kind) return;
      if (kind === 'tableRip') {
        addTableSawSchematic({
          bevelDeg: 0,
          fenceFaceMm: STOCK_W,
          stockWmm: FULL_2X6_W,
          stockHmm: STRUT_H,
          label: `2×6 → ${fmt(STRUT_H)}×${fmt(STOCK_W)}`
        });
      } else if (kind === 'tableBevel') {
        addTableSawSchematic({
          bevelDeg: BEVEL_DEG,
          fenceFaceMm: STRUT_W,
          stockWmm: STOCK_W,
          stockHmm: STRUT_H,
          label: `${BEVEL_DEG}° → face ${fmt(STRUT_W)}`
        });
      } else if (kind === 'miterCrosscut') {
        addMiterSawSchematic({ miterDeg: 0, bevelDeg: 0, stop: true, label: `crosscut ~${fmt(BLANK_LEN)}` });
      } else if (kind === 'miterSimple') {
        addMiterSawSchematic({ miterDeg: HEX.apex, bevelDeg: 0, stop: true, label: `miters ${HEX.base}° / ${HEX.apex}°` });
      } else if (kind === 'miterCompound') {
        addMiterSawSchematic({
          miterDeg: HEX.apex, bevelDeg: BEVEL_DEG, bevelSide: 'L', stop: true, compound: true,
          label: `compound ears ${HEX.apex}° + ${BEVEL_DEG}° · RH = opposite tilt`
        });
      } else if (kind === 'handLayout' || kind === 'drill' || kind === 'none') {
        addNoMachineVisual(kind);
      }
    }

    function rebuild() {
      group.clear();
      const woodRoot = new THREE.Group();
      const machineRoot = new THREE.Group();
      group.add(woodRoot);
      group.add(machineRoot);
      woodTarget = woodRoot;
      machineTarget = machineRoot;

      const view = STEPS[step].view;
      const mv = STEPS[step].machineVisual;
      const saw = hasSawVisual(mv);
      // Machine mode (default): MATERIALS pane LEFT | MACHINE pane RIGHT (same as miters)
      // Wood mode: materials only
      const showWood = !saw || vizMode === 'wood' || vizMode === 'machine';
      const showMachine = !saw || vizMode === 'machine';
      const split = saw && showWood && showMachine;
      if (split) {
        woodRoot.position.x = WOOD_SPLIT_X;
        machineRoot.position.x = MACHINE_SPLIT_X;
      }
      const { pA, pB, pC, h, c } = hexPoints();
      const up = new THREE.Vector3(0, 1, 0);
      if (!showMachine) setMachineHud(null);

      if (showWood && view === 'blanks') {
        // Face-on 2×6 blank — large enough to fill MATERIALS like miters
        if (split) addMaterialsPad(1.15, 1.0);
        const blank = new THREE.Mesh(
          new THREE.BoxGeometry(0.95, 0.18, 0.32),
          woodMat
        );
        blank.position.set(0.05, 0.11, 0);
        woodTarget.add(blank);
        woodTarget.add(makeLabel(`2×6 blank ~${fmt(BLANK_LEN)}`, new THREE.Vector3(0.05, 0.36, 0)));
        woodTarget.add(makeLabel(`× ${HEX.qty * 3} strut blanks`, new THREE.Vector3(0.05, -0.08, 0)));
      }

      if (showWood && view === 'stock') {
        if (step === 1) {
          // MATERIALS: large cross-section 2×6 → two halves (fills left pane like miters)
          if (split) addMaterialsPad(1.25, 1.05);
          const halfLabel = units === 'mm'
            ? `${STRUT_H}×${STOCK_W} mm (${STRUT_H_IN} × ${STOCK_W_IN})`
            : `${STRUT_H_IN} × ${STOCK_W_IN} (${STRUT_H}×${STOCK_W} mm)`;

          const full = new THREE.Mesh(
            new THREE.BoxGeometry(0.52, 0.22, 0.18),
            woodMat
          );
          full.position.set(-0.28, 0.13, 0);
          woodTarget.add(full);
          woodTarget.add(makeLabel('2×6 stock blank', new THREE.Vector3(-0.28, 0.38, 0)));

          const arr = arrowMesh(new THREE.Vector3(1, 0, 0), 0xc48a4a);
          arr.position.set(0.06, 0.16, 0);
          woodTarget.add(arr);
          woodTarget.add(makeLabel('rip in half', new THREE.Vector3(0.06, 0.42, 0)));

          [0.32, 0.58].forEach((x) => {
            const half = new THREE.Mesh(
              new THREE.BoxGeometry(0.22, 0.22, 0.18),
              woodMat
            );
            half.position.set(x, 0.13, 0);
            woodTarget.add(half);
          });
          woodTarget.add(makeLabel(halfLabel, new THREE.Vector3(0.45, 0.38, 0)));
          woodTarget.add(makeLabel('matched pair', new THREE.Vector3(0.45, -0.08, 0)));
        }
        if (step === 2) {
          // Optional finish — no saw; stained matched pairs
          [-0.15, 0.15].forEach((x, i) => {
            const half = new THREE.Mesh(
              new THREE.BoxGeometry(STOCK_W / 1000, STRUT_H / 1000, 1.0),
              stainMat
            );
            half.position.set(x, STRUT_H / 2000, 0);
            woodTarget.add(half);
            woodTarget.add(makeLabel(i === 0 ? `${fmt(STRUT_H)}×${fmt(STOCK_W)} stained` : 'matched pair', new THREE.Vector3(x, 0.08, 0.4)));
          });
        }
      }

      if (showWood && view === 'bevel') {
        // Cross-section: ripped half → finished face + bevel (large, centered)
        if (split) addMaterialsPad(1.2, 1.0);
        const halfLbl = units === 'mm'
          ? `${STRUT_H}×${STOCK_W} mm`
          : `${STRUT_H_IN} × ${STOCK_W_IN}`;
        const finLbl = units === 'mm'
          ? `${STRUT_H}×${STRUT_W} mm`
          : `${STRUT_H_IN} × ${STRUT_W_IN}`;

        const halfIn = new THREE.Mesh(
          new THREE.BoxGeometry(0.28, 0.22, 0.18),
          woodMat
        );
        halfIn.position.set(-0.28, 0.13, 0);
        woodTarget.add(halfIn);
        woodTarget.add(makeLabel(`ripped half ${halfLbl}`, new THREE.Vector3(-0.28, 0.38, 0)));

        const arr = arrowMesh(new THREE.Vector3(1, 0, 0), 0xc48a4a);
        arr.position.set(0.02, 0.16, 0);
        woodTarget.add(arr);

        const finished = new THREE.Mesh(
          new THREE.BoxGeometry(0.16, 0.22, 0.18),
          woodMat
        );
        finished.position.set(0.34, 0.13, 0);
        woodTarget.add(finished);
        const bevelEdge = new THREE.Mesh(
          new THREE.BoxGeometry(0.05, 0.22, 0.18),
          bevelMat
        );
        bevelEdge.position.set(0.45, 0.13, 0);
        woodTarget.add(bevelEdge);
        woodTarget.add(makeLabel(`template ${finLbl}`, new THREE.Vector3(0.40, 0.38, 0)));
        woodTarget.add(makeLabel(`${BEVEL_DEG}° bevel out`, new THREE.Vector3(0.40, -0.08, 0)));
      }

      if (showWood && (view === 'jig' || view === 'jigStops')) {
        addJig(pA, pB, pC, h, c, view === 'jigStops');
        if (view === 'jig') {
          woodTarget.add(makeLabel('arc ∩ = apex', pC.clone().add(new THREE.Vector3(0, 0.08, 0.05))));
        } else {
          const s1 = placeStrut(pA, pB, up);
          const s2 = placeStrut(pB, pC, up);
          const s3 = placeStrut(pC, pA, up);
          woodTarget.add(s1, s2, s3);
        }
      }

      if (showWood && view === 'miters') {
        addJig(pA, pB, pC, h, c, false);
        const s1 = placeStrut(pA, pB, up);
        const s2 = placeStrut(pB, pC, up);
        const s3 = placeStrut(pC, pA, up);
        s1.position.z -= 0.22;
        s2.position.x += 0.22;
        s3.position.x -= 0.22;
        woodTarget.add(s1, s2, s3);
        woodTarget.add(makeLabel(`${HEX.apex}°`, pC.clone().add(new THREE.Vector3(0, 0.08, 0.04))));
        woodTarget.add(makeLabel(`${HEX.base}°`, pA.clone().add(new THREE.Vector3(-0.06, 0.08, 0))));
        woodTarget.add(makeLabel(`${HEX.base}°`, pB.clone().add(new THREE.Vector3(0.06, 0.08, 0))));
      }

      if (showWood && (view === 'ears' || view === 'assemble' || view === 'done')) {
        addJig(pA, pB, pC, h, c, view !== 'ears');
        woodTarget.add(placeStrut(pA, pB, up), placeStrut(pB, pC, up), placeStrut(pC, pA, up));
        woodTarget.add(makeLabel(`${HEX.apex}°`, pC.clone().add(new THREE.Vector3(0, 0.08, 0.04))));
        woodTarget.add(makeLabel(`${HEX.base}°`, pA.clone().add(new THREE.Vector3(-0.06, 0.08, 0))));
        woodTarget.add(makeLabel(`${HEX.base}°`, pB.clone().add(new THREE.Vector3(0.06, 0.08, 0))));
        woodTarget.add(makeLabel(fmt(HEX.c), new THREE.Vector3(0, 0.06, -0.04)));
        woodTarget.add(makeLabel(fmt(HEX.a), new THREE.Vector3((pA.x + pC.x) / 2 - 0.08, 0.06, (pA.z + pC.z) / 2)));
        woodTarget.add(makeLabel(fmt(HEX.b), new THREE.Vector3((pB.x + pC.x) / 2 + 0.08, 0.06, (pB.z + pC.z) / 2)));
        if (view === 'ears') {
          [pA, pB, pC].forEach((p) => {
            const ear = new THREE.Mesh(new THREE.ConeGeometry(0.018, 0.05, 4), bevelMat);
            ear.position.copy(p);
            ear.position.y = 0.03;
            woodTarget.add(ear);
          });
        }
        if (view === 'done') {
          woodTarget.add(makeLabel(`${HEX.qty} incl. 4 windows`, new THREE.Vector3(0, 0.2, h / 2)));
        }
      }

      // Right pane: branded machine schematic (saw steps in Machine/split mode)
      if (showMachine) {
        addMachineVisual(mv);
      }

      if (split) {
        // Two pane floors with a clear gap under the divider (not one shared shop floor)
        addPaneFloor(group, WOOD_SPLIT_X);
        addPaneFloor(group, MACHINE_SPLIT_X);
      } else {
        const grid = new THREE.GridHelper(4.5, 18, 0x2a3140, 0x1a1e26);
        grid.position.y = -0.02;
        group.add(grid);
      }

      const chrome = document.getElementById('splitChrome');
      if (split) {
        chrome.hidden = false;
        const brand = (mv || '').startsWith('miter') ? 'makita' : 'dewalt';
        chrome.classList.toggle('makita', brand === 'makita');
        layoutSplitChrome();
      } else {
        chrome.hidden = true;
        chrome.classList.remove('makita');
      }
    }

    function setMachineSetup() {
      const s = STEPS[step];
      const ms = s.machineSetup;
      const el = document.getElementById('machinesetup');
      const tools = typeof ms.machines === 'function' ? ms.machines() : ms.machines;
      const settings = (typeof ms.settings === 'function' ? ms.settings() : ms.settings) || [];
      const lis = settings.map((line) => `<li>${line}</li>`).join('');
      el.innerHTML =
        `<div class="ms-title">Machine setup</div>` +
        `<div class="ms-tools">${tools}</div>` +
        (lis ? `<ul>${lis}</ul>` : '');
    }

    function setDims() {
      const s = STEPS[step];
      document.getElementById('dims').textContent =
        `Hex ×${HEX.qty} including 4 windows\n` +
        `Sides: ${fmt(HEX.a)} / ${fmt(HEX.b)} / base ${fmt(HEX.c)}\n` +
        `Miters off 90°: apex ${HEX.apex}° · bases ${HEX.base}° / ${HEX.base}°\n` +
        `Stock: 2×6 → ${fmt(STRUT_H)} × ${fmt(STOCK_W)} · bevel ${BEVEL_DEG}° → finished ${fmt(STRUT_H)} × ${fmt(STRUT_W)}\n\n` +
        s.title + '\n' + s.text();
    }

    function setCutList() {
      const lines = [
        `Hex panels: ${HEX.qty} including 4 windows`,
        `Struts total: ${HEX.qty * 3}`,
        `Blank length: ~${fmt(BLANK_LEN)} (longest side ${fmt(HEX.a)})`,
        `Finished long-point: ${HEX.qty * 2} × side ${planDual(HEX.a, HEX.aIn)} + ${HEX.qty} × base ${planDual(HEX.c, HEX.cIn)}`,
        `Per panel sides: a=${fmt(HEX.a)}  b=${fmt(HEX.b)}  c=${fmt(HEX.c)}`,
        `First-end miters: ${HEX.qty * 2} × ${HEX.base}° + ${HEX.qty} × ${HEX.apex}°`,
        `Cross-section: ${fmt(STRUT_H)} × ${fmt(STOCK_W)} stock → ${fmt(STRUT_H)} × ${fmt(STRUT_W)} + ${BEVEL_DEG}°`,
        `Screws (2×3 corners×panels): ${HEX.qty * 6}`
      ];
      document.getElementById('cutlist').textContent = lines.join('\n');
    }

    function renderSteps() {
      const wrap = document.getElementById('steps');
      wrap.innerHTML = '';
      STEPS.forEach((s) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'step' + (s.id === step ? ' active' : '');
        b.textContent = s.title;
        b.onclick = () => { step = s.id; sync(); };
        wrap.appendChild(b);
      });
    }

    function sync() {
      document.getElementById('uIN').classList.toggle('active', units === 'in');
      document.getElementById('uMM').classList.toggle('active', units === 'mm');
      const saw = hasSawVisual(STEPS[step].machineVisual);
      document.getElementById('vizrow').classList.toggle('show', saw);
      document.getElementById('vizMachine').classList.toggle('active', vizMode === 'machine');
      document.getElementById('vizWood').classList.toggle('active', vizMode === 'wood');
      renderSteps();
      setDims();
      setMachineSetup();
      setCutList();
      rebuild();
      if (saw && vizMode === 'machine') {
        // Frame MATERIALS left of world-center divider + MACHINE right
        camera.position.set(0.15, 1.55, 3.4);
        controls.target.set(0.05, 0.2, 0);
      } else if (saw && vizMode === 'wood') {
        camera.position.set(-0.9, 1.35, 2.7);
        controls.target.set(WOOD_SPLIT_X, 0.2, 0);
      }
    }

    document.getElementById('uIN').onclick = () => { units = 'in'; sync(); };
    document.getElementById('uMM').onclick = () => { units = 'mm'; sync(); };
    document.getElementById('vizMachine').onclick = () => { vizMode = 'machine'; sync(); };
    document.getElementById('vizWood').onclick = () => { vizMode = 'wood'; sync(); };
    document.getElementById('btnReset').onclick = () => {
      camera.position.set(1.6, 1.2, 2.2);
      controls.target.set(0, 0.35, 0);
    };
    function resize() {
      const w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      labelRenderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      layoutSplitChrome();
    }
    addEventListener('resize', resize);
    resize();
    sync();

    (function loop() {
      requestAnimationFrame(loop);
      if (window.__pause) return;
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
    })();

</script>
</body>
</html>
