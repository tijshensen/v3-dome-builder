        woodTarget.add(makeLabel(`apex miter ${HEX.apex}°`, pC.clone().add(new THREE.Vector3(0, 0.08, 0.04))));
        woodTarget.add(makeLabel(`base miter ${HEX.base}°`, pA.clone().add(new THREE.Vector3(-0.1, 0.08, 0))));
        woodTarget.add(makeLabel(`base miter ${HEX.base}°`, pB.clone().add(new THREE.Vector3(0.1, 0.08, 0))));
        woodTarget.add(makeLabel(`+ ${BEVEL_DEG}° bevel`, new THREE.Vector3(0, 0.14, h / 2)));
        [pA, pB, pC].forEach((p) => {
          const ear = new THREE.Mesh(new THREE.ConeGeometry(0.018, 0.05, 4), bevelMat);
          ear.position.copy(p);
          ear.position.y = 0.03;
          woodTarget.add(ear);
        });
        return `compound ears + ${BEVEL_DEG}°`;
      }
      if (key === 'assembled' || key === 'done') {
        addJig(pA, pB, pC, h, c, true);
        woodTarget.add(placeStrut(pA, pB, up), placeStrut(pB, pC, up), placeStrut(pC, pA, up));
        if (key === 'done') {
          woodTarget.add(makeLabel(`${HEX.qty} incl. 4 windows`, new THREE.Vector3(0, 0.2, h / 2)));
          return `${HEX.qty} hex panels`;
        }
        return 'assembled frame';
      }
      return '';
    }

    // --- Graph node roots / previews ---
    const graphHold = new THREE.Group();
    scene.add(graphHold);
    graphHold.visible = false;
    /** @type {Map<string, { root: THREE.Group, title: string, callout: string, preview: string }>} */
    const graphNodeState = new Map();
    let graphModalNodeId = null;

    function clearGraphNodeState() {
      for (const st of graphNodeState.values()) {
        clearCss2dIn(st.root);
        if (st.root.parent) st.root.parent.remove(st.root);
      }
      graphNodeState.clear();
      clearCss2dIn(graphHold);
      graphHold.clear();
    }

    function applyOverrideVisuals(root, ov) {
      if (!root || !ov) return;
      if (ov.scale != null && Number.isFinite(ov.scale)) {
        root.scale.setScalar(ov.scale);
      }
      if (ov.highlightColor) {
        const col = new THREE.Color(ov.highlightColor);
        root.traverse((obj) => {
          if (obj.isMesh && obj.material && obj.material.color) {
            const m = obj.material.clone();
            m.color = col;
            if ('emissive' in m) {
              m.emissive = col.clone().multiplyScalar(0.15);
              m.emissiveIntensity = 0.35;
            }
            obj.material = m;
          }
        });
      }
      if (Array.isArray(ov.labelTexts)) {
        ov.labelTexts.forEach((t, i) => {
          root.add(makeLabel(t, new THREE.Vector3(0, 0.45 + i * 0.08, 0)));
        });
      }
      if (ov.note) root.add(makeLabel(ov.note, new THREE.Vector3(0, -0.22, 0)));
      if (ov.qtyLabel) root.add(makeLabel(`qty ${ov.qtyLabel}`, new THREE.Vector3(0.35, 0.4, 0)));
      if (ov.dimsLabel) root.add(makeLabel(ov.dimsLabel, new THREE.Vector3(-0.35, 0.4, 0)));
    }

    function buildGraphNodeRoot(n) {
      const root = new THREE.Group();
      root.name = `graph:${n.id}`;
      const ov = getCurrentOverride(n.id, n.kind);
      if (n.kind === 'machine') {
        const prev = machineTarget;
        machineTarget = root;
        addMachineVisual(n.machineVisual, ov || {});
        machineTarget = prev;
      } else {
        const prev = woodTarget;
        woodTarget = root;
        buildMaterialKey(n.materialKey);
        woodTarget = prev;
      }
      applyOverrideVisuals(root, ov);
      const callout = nodeCallout(n);
      const preview = captureRolePreview(root);
      // captureRolePreview parks in roleHold — reclaim for graph
      graphHold.add(root);
      graphNodeState.set(n.id, { root, title: n.title, callout, preview, override: ov || null });
      return graphNodeState.get(n.id);
    }

    /** Rebuild one graph node and refresh open modal / DOM thumb. */
    function rebuildGraphNodeLive(nodeId) {
      const n = nodeById(nodeId);
      if (!n) return;
      const prev = graphNodeState.get(nodeId);
      const wasInModal = graphModalNodeId === nodeId && modalOpen;
      if (wasInModal) {
        // Detach from modal host without closing dialog
        clearCss2dIn(modalHost);
        while (modalLabelRenderer.domElement.firstChild) {
          modalLabelRenderer.domElement.removeChild(modalLabelRenderer.domElement.firstChild);
        }
        modalHost.clear();
      }
      if (prev) {
        clearCss2dIn(prev.root);
        if (prev.root.parent) prev.root.parent.remove(prev.root);
        graphNodeState.delete(nodeId);
      }
      const st = buildGraphNodeRoot(n);
      // Refresh graph card callout/thumb
      const card = document.querySelector(`.graph-node[data-node-id="${nodeId}"]`);
      if (card && st) {
        const callEl = card.querySelector('.gn-callout');
        if (callEl) callEl.textContent = st.callout || '';
        const thumb = card.querySelector('.gn-thumb');
        if (thumb && st.preview) thumb.style.backgroundImage = `url(${st.preview})`;
      }
      if (wasInModal) {
        const title = `${n.kind === 'machine' ? 'Machine' : 'Material'}: ${n.title}` +
          (st.callout ? ' — ' + st.callout : '');
        if (n.kind === 'machine' && typeof n.stepId === 'number') {
          fillModalSide({ kind: 'machine', stepObj: STEPS[n.stepId], node: n });
        } else if (n.kind === 'material') {
          fillModalSide({ kind: 'material', node: n });
        }
        syncEditChrome(n);
        presentModalRoot(st.root, title);
      }
    }

    function rebuildGraphPreviews() {
      if (graphModalNodeId) closeRoleModal(true);
      clearGraphNodeState();
      for (const n of GRAPH.nodes) buildGraphNodeRoot(n);
      renderGraphDom();
    }

    // --- Graph DOM: pan / zoom / edges ---
    const graphViewport = document.getElementById('graphViewport');
    const graphWorld = document.getElementById('graphWorld');
    const graphEdgesSvg = document.getElementById('graphEdges');
    const graphNodesEl = document.getElementById('graphNodes');
    let graphPan = { x: 12, y: 16, scale: 0.72 };
    let graphDrag = null;

    function applyGraphTransform() {
      graphWorld.style.transform =
        `translate(${graphPan.x}px, ${graphPan.y}px) scale(${graphPan.scale})`;
    }

    function graphContentSize() {
      let maxX = 0, maxY = 0;
      for (const n of GRAPH.nodes) {
        maxX = Math.max(maxX, n.x + NODE_W);
        maxY = Math.max(maxY, n.y + NODE_H);
      }
      return { w: maxX + 40, h: maxY + 40 };
    }

    function fitGraphView() {
      const { w, h } = graphContentSize();
      const vw = graphViewport.clientWidth || 600;
      const vh = graphViewport.clientHeight || 400;
      const pad = 20;
      const s = Math.min((vw - pad * 2) / w, (vh - pad * 2) / h, 1);
      graphPan.scale = Math.max(0.35, s);
      graphPan.x = (vw - w * graphPan.scale) / 2;
      graphPan.y = (vh - h * graphPan.scale) / 2;
      applyGraphTransform();
    }

    function edgePath(a, b) {
      const x1 = a.x + NODE_W;
      const y1 = a.y + NODE_H * 0.42;
      const x2 = b.x;
      const y2 = b.y + NODE_H * 0.42;
      const dx = Math.max(40, (x2 - x1) * 0.45);
      return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
    }

    function renderGraphDom() {
      const { w, h } = graphContentSize();
      graphEdgesSvg.setAttribute('width', String(w));
      graphEdgesSvg.setAttribute('height', String(h));
      graphEdgesSvg.style.width = w + 'px';
      graphEdgesSvg.style.height = h + 'px';
      graphWorld.style.width = w + 'px';
      graphWorld.style.height = h + 'px';

      // markers
      const fanIds = new Set();
      const outCount = new Map();
      const inCount = new Map();
      for (const e of GRAPH.edges) {
        outCount.set(e.from, (outCount.get(e.from) || 0) + 1);
        inCount.set(e.to, (inCount.get(e.to) || 0) + 1);
      }
      for (const e of GRAPH.edges) {
        if (e.fan || (outCount.get(e.from) || 0) > 1 || (inCount.get(e.to) || 0) > 1) fanIds.add(`${e.from}->${e.to}`);
      }

      graphEdgesSvg.innerHTML =
        `<defs>
          <marker id="gArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="currentColor" style="color:var(--muted)" />
          </marker>
          <marker id="gArrowFan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="currentColor" style="color:var(--accent)" />
          </marker>
        </defs>` +
        GRAPH.edges.map((e, edgeIdx) => {
          const a = nodeById(e.from);
          const b = nodeById(e.to);
          if (!a || !b) return '';
          const isFan = fanIds.has(`${e.from}->${e.to}`);
          const sel = (authorMode && authorSelectedEdgeIdx === edgeIdx) ? ' author-edge-selected' : '';
          return `<path data-edge-idx="${edgeIdx}" class="${isFan ? 'fan' : ''}${sel}" d="${edgePath(a, b)}" marker-end="url(#${isFan ? 'gArrowFan' : 'gArrow'})" />`;
        }).join('');

      if (authorMode) {
        graphEdgesSvg.querySelectorAll('path[data-edge-idx]').forEach((p) => {
          p.style.pointerEvents = 'stroke';
          p.style.cursor = 'pointer';
          p.addEventListener('click', (ev) => {
            ev.stopPropagation();
            const idx = Number(p.dataset.edgeIdx);
            selectAuthorEdge(idx);
            showAuthorEdgePanel(idx);
          });
        });
      }

      graphNodesEl.innerHTML = '';
      for (const n of GRAPH.nodes) {
        const st = graphNodeState.get(n.id);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `graph-node ${n.kind}` + (n.stepId === step ? ' active' : '') +
          (authorMode && authorSelectedId === n.id ? ' author-selected' : '');
        btn.style.left = n.x + 'px';
        btn.style.top = n.y + 'px';
        btn.dataset.nodeId = n.id;
        btn.title = authorMode ? 'Select / drag (double-click opens 3D)' : 'Open interactive 3D';
        const callout = (st && st.callout) || nodeCallout(n);
        btn.innerHTML =
          `<div class="gn-kind">${n.kind}</div>` +
          `<div class="gn-title"></div>` +
          (n.kind === 'machine'
            ? `<div class="gn-callout"></div>`
            : `<div class="gn-qty" hidden></div>` +
              `<div class="gn-dims" hidden></div>` +
              `<div class="gn-note" hidden></div>`) +
          `<img class="gn-thumb" alt="" />`;
        btn.querySelector('.gn-title').textContent = n.title;
        if (n.kind === 'machine') {
          btn.querySelector('.gn-callout').textContent = callout;
        } else {
          const parts = materialCalloutParts(n.materialKey);
          const qtyEl = btn.querySelector('.gn-qty');
          const dimsEl = btn.querySelector('.gn-dims');
          const noteEl = btn.querySelector('.gn-note');
          if (parts.qty) {
            qtyEl.hidden = false;
            qtyEl.textContent = `Qty: ${parts.qty}`;
          }
          if (parts.dims) {
            dimsEl.hidden = false;
            dimsEl.textContent = `Dims: ${parts.dims}`;
          }
          if (parts.note) {
            noteEl.hidden = false;
            noteEl.textContent = parts.note;
          }
        }
        const img = btn.querySelector('.gn-thumb');
        if (st && st.preview) img.src = st.preview;
        btn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          if (authorMode) {
            if (onAuthorNodeClick(n, ev)) return;
          }
          openGraphNodeModal(n.id);
        });
        btn.addEventListener('dblclick', (ev) => {
          if (!authorMode) return;
          ev.stopPropagation();
          ev.preventDefault();
          openGraphNodeModal(n.id);
        });
        if (authorMode) {
          btn.addEventListener('pointerdown', (ev) => {
            if (ev.button != null && ev.button !== 0) return;
            // start node drag — pan handler skips .graph-node already
            ev.stopPropagation();
            btn.setPointerCapture(ev.pointerId);
            authorNodeDrag = {
              pid: ev.pointerId,
              id: n.id,
              startX: ev.clientX,
              startY: ev.clientY,
              origX: n.x,
              origY: n.y,
              moved: false
            };
            btn.classList.add('dragging');
          });
          btn.addEventListener('pointermove', (ev) => {
            if (!authorNodeDrag || authorNodeDrag.pid !== ev.pointerId || authorNodeDrag.id !== n.id) return;
            const dx = (ev.clientX - authorNodeDrag.startX) / graphPan.scale;
            const dy = (ev.clientY - authorNodeDrag.startY) / graphPan.scale;
            if (!authorNodeDrag.moved && (Math.abs(dx) > 3 || Math.abs(dy) > 3)) {
              authorNodeDrag.moved = true;
              authorSuppressClick = true;
            }
            if (!authorNodeDrag.moved) return;
            n.x = Math.round(authorNodeDrag.origX + dx);
            n.y = Math.round(authorNodeDrag.origY + dy);
            btn.style.left = n.x + 'px';
            btn.style.top = n.y + 'px';
            // live-update edges without full rebuild of nodes
            const { w, h } = graphContentSize();
            graphEdgesSvg.setAttribute('width', String(w));
            graphEdgesSvg.setAttribute('height', String(h));
            graphEdgesSvg.style.width = w + 'px';
            graphEdgesSvg.style.height = h + 'px';
            graphWorld.style.width = w + 'px';
            graphWorld.style.height = h + 'px';
            graphEdgesSvg.querySelectorAll('path[data-edge-idx]').forEach((p) => {
              const idx = Number(p.dataset.edgeIdx);
              const e = GRAPH.edges[idx];
              if (!e) return;
              const a = nodeById(e.from);
              const b = nodeById(e.to);
              if (!a || !b) return;
              p.setAttribute('d', edgePath(a, b));
            });
            const xEl = document.getElementById('authorEditX');
            const yEl = document.getElementById('authorEditY');
            if (xEl && authorSelectedId === n.id) {
              xEl.value = String(n.x);
              yEl.value = String(n.y);
            }
          });
          const endNodeDrag = (ev) => {
            if (!authorNodeDrag || authorNodeDrag.pid !== ev.pointerId) return;
            const moved = authorNodeDrag.moved;
            btn.classList.remove('dragging');
            authorNodeDrag = null;
            if (moved) {
              // refresh world size / selection; keep suppress until click
              renderGraphDom();
              selectAuthorNode(n.id);
            }
          };
          btn.addEventListener('pointerup', endNodeDrag);
          btn.addEventListener('pointercancel', endNodeDrag);
        }
        graphNodesEl.appendChild(btn);
      }
      applyGraphTransform();
      syncAuthorChrome();
    }

    function highlightGraphForStep() {
      graphNodesEl.querySelectorAll('.graph-node').forEach((el) => {
        const n = nodeById(el.dataset.nodeId);
        el.classList.toggle('active', !!(n && n.stepId === step));
      });
    }

    // Pointer pan
    graphViewport.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.graph-node')) return;
      graphDrag = { pid: e.pointerId, x: e.clientX, y: e.clientY, ox: graphPan.x, oy: graphPan.y };
      graphViewport.classList.add('panning');
      graphViewport.setPointerCapture(e.pointerId);
    });
    graphViewport.addEventListener('pointermove', (e) => {
      if (!graphDrag || e.pointerId !== graphDrag.pid) return;
      graphPan.x = graphDrag.ox + (e.clientX - graphDrag.x);
      graphPan.y = graphDrag.oy + (e.clientY - graphDrag.y);
      applyGraphTransform();
    });
    function endGraphDrag(e) {
      if (!graphDrag || (e && e.pointerId !== graphDrag.pid)) return;
      graphDrag = null;
      graphViewport.classList.remove('panning');
    }
    graphViewport.addEventListener('pointerup', endGraphDrag);
    graphViewport.addEventListener('pointercancel', endGraphDrag);
    function zoomGraphAt(mx, my, next) {
      const before = graphPan.scale;
      next = Math.min(1.8, Math.max(0.3, next));
      const wx = (mx - graphPan.x) / before;
      const wy = (my - graphPan.y) / before;
      graphPan.scale = next;
      graphPan.x = mx - wx * next;
      graphPan.y = my - wy * next;
      applyGraphTransform();
    }

    graphViewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = graphViewport.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      zoomGraphAt(mx, my, graphPan.scale * (e.deltaY > 0 ? 0.9 : 1.1));
    }, { passive: false });

    // Pinch zoom (two-finger)
    let pinch = null;
    graphViewport.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        const rect = graphViewport.getBoundingClientRect();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        pinch = {
          dist: Math.hypot(dx, dy) || 1,
          scale: graphPan.scale,
          mx: ((e.touches[0].clientX + e.touches[1].clientX) / 2) - rect.left,
          my: ((e.touches[0].clientY + e.touches[1].clientY) / 2) - rect.top
        };
        graphDrag = null;
      }
    }, { passive: true });
    graphViewport.addEventListener('touchmove', (e) => {
      if (!pinch || e.touches.length !== 2) return;
      e.preventDefault();
      const rect = graphViewport.getBoundingClientRect();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy) || 1;
      const mx = ((e.touches[0].clientX + e.touches[1].clientX) / 2) - rect.left;
      const my = ((e.touches[0].clientY + e.touches[1].clientY) / 2) - rect.top;
      zoomGraphAt(mx, my, pinch.scale * (dist / pinch.dist));
    }, { passive: false });
    graphViewport.addEventListener('touchend', () => { pinch = null; }, { passive: true });
    graphViewport.addEventListener('touchcancel', () => { pinch = null; }, { passive: true });

    document.getElementById('graphFit').onclick = () => fitGraphView();
    document.getElementById('graphResetView').onclick = () => {
      graphPan = { x: 12, y: 16, scale: 0.72 };
      applyGraphTransform();
    };

    // --- Author graph tooling (option C) ---
    enterAuthorFromQueryIfNeeded();
    authorMode = readAuthorFlag();

    (function wireAuthorUi() {
      const addKind = document.getElementById('authorAddKind');
      const addMatWrap = document.getElementById('authorAddMatWrap');
      const addMachWrap = document.getElementById('authorAddMachWrap');
      function syncAddKindUi() {
        const kind = addKind.value;
        addMatWrap.hidden = kind !== 'material';
        addMachWrap.hidden = kind !== 'machine';
      }
      fillKeySelect(document.getElementById('authorAddMaterialKey'), materialKeyAllowlist());
      fillKeySelect(document.getElementById('authorAddMachineVisual'), machineVisualAllowlist());
      if (addKind) addKind.onchange = syncAddKindUi;
      syncAddKindUi();

      const editKind = document.getElementById('authorEditKind');
      if (editKind) {
        editKind.onchange = () => {
          const kind = editKind.value;
          document.getElementById('authorEditMatWrap').hidden = kind !== 'material';
          document.getElementById('authorEditMachWrap').hidden = kind !== 'machine';
        };
      }

      document.getElementById('authorAddNode').onclick = () => {
        fillKeySelect(document.getElementById('authorAddMaterialKey'), materialKeyAllowlist());
        fillKeySelect(document.getElementById('authorAddMachineVisual'), machineVisualAllowlist());
        syncAddKindUi();
        const dlg = document.getElementById('authorAddNodeDialog');
        if (dlg && typeof dlg.showModal === 'function') dlg.showModal();
        else if (dlg) dlg.setAttribute('open', '');
      };
      document.getElementById('authorAddNodeCancel').onclick = () => {
        const dlg = document.getElementById('authorAddNodeDialog');
        if (dlg && typeof dlg.close === 'function') dlg.close();
        else if (dlg) dlg.removeAttribute('open');
      };
      document.getElementById('authorAddNodeConfirm').onclick = () => {
        const kind = document.getElementById('authorAddKind').value;
        const title = document.getElementById('authorAddTitle').value;
        const key = kind === 'machine'
          ? document.getElementById('authorAddMachineVisual').value
          : document.getElementById('authorAddMaterialKey').value;
        addAuthorNode({ kind, title, key });
        const dlg = document.getElementById('authorAddNodeDialog');
        if (dlg && typeof dlg.close === 'function') dlg.close();
        else if (dlg) dlg.removeAttribute('open');
        document.getElementById('authorAddTitle').value = '';
      };

      document.getElementById('authorAddEdge').onclick = () => {
        if (authorEdgePick) {
          cancelAddEdgeMode();
          document.getElementById('authorEdgePanel').hidden = true;
          syncAuthorChrome();
        } else {
          beginAddEdgeMode();
        }
      };

      document.getElementById('authorDelete').onclick = () => deleteAuthorSelection();

      document.getElementById('authorExport').onclick = () => {
        document.getElementById('authorEditPanel').hidden = true;
        document.getElementById('authorEdgePanel').hidden = true;
        const panel = document.getElementById('authorExportPanel');
        panel.hidden = false;
        document.getElementById('authorExportText').value = exportGraphJson();
        document.getElementById('authorExportStatus').textContent = '';
      };
      document.getElementById('authorExportClose').onclick = () => {
        document.getElementById('authorExportPanel').hidden = true;
      };
      document.getElementById('authorExportCopy').onclick = async () => {
        const t = document.getElementById('authorExportText').value;
        const st = document.getElementById('authorExportStatus');
        try {
          await navigator.clipboard.writeText(t);
          st.textContent = 'Copied.';
        } catch (e) {
          document.getElementById('authorExportText').select();
          st.textContent = 'Select + copy manually.';
        }
      };
      document.getElementById('authorExportDownload').onclick = () => {
        const t = document.getElementById('authorExportText').value;
        const blob = new Blob([t], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'hex-graph.json';
        a.click();
        URL.revokeObjectURL(a.href);
        document.getElementById('authorExportStatus').textContent = 'Downloaded hex-graph.json';
      };

      document.getElementById('authorReset').onclick = () => resetAuthoredGraph();
      document.getElementById('authorExit').onclick = () => setAuthorMode(false);

      document.getElementById('authorEditApply').onclick = () => applyAuthorEdit();
      document.getElementById('authorEditClose').onclick = () => {
        document.getElementById('authorEditPanel').hidden = true;
      };
      document.getElementById('authorEditOpen').onclick = () => {
        if (authorSelectedId) openGraphNodeModal(authorSelectedId);
      };

      document.getElementById('authorEdgeApply').onclick = () => {
        const from = document.getElementById('authorEdgeFrom').value;
        const to = document.getElementById('authorEdgeTo').value;
        const fan = document.getElementById('authorEdgeFan').checked;
        if (!from || !to || from === to) {
          alert('Pick distinct from and to nodes.');
          return;
        }
        if (authorSelectedEdgeIdx != null && GRAPH.edges[authorSelectedEdgeIdx]) {
          const e = GRAPH.edges[authorSelectedEdgeIdx];
          e.from = from;
          e.to = to;
          if (fan) e.fan = true;
          else delete e.fan;
        } else {
          const exists = GRAPH.edges.findIndex((e) => e.from === from && e.to === to);
          if (exists >= 0) {
            authorSelectedEdgeIdx = exists;
            if (fan) GRAPH.edges[exists].fan = true;
            else delete GRAPH.edges[exists].fan;
          } else {
            const edge = { from, to };
            if (fan) edge.fan = true;
            GRAPH.edges.push(edge);
            authorSelectedEdgeIdx = GRAPH.edges.length - 1;
          }
        }
        cancelAddEdgeMode();
        renderGraphDom();
        showAuthorEdgePanel(authorSelectedEdgeIdx);
        syncAuthorChrome();
      };
      document.getElementById('authorEdgeDelete').onclick = () => {
        if (authorSelectedEdgeIdx == null) {
          // try match from/to
          const from = document.getElementById('authorEdgeFrom').value;
          const to = document.getElementById('authorEdgeTo').value;
          const idx = GRAPH.edges.findIndex((e) => e.from === from && e.to === to);
          if (idx >= 0) authorSelectedEdgeIdx = idx;
        }
        if (authorSelectedEdgeIdx == null) {
          alert('No edge selected.');
          return;
        }
        deleteAuthorSelection();
      };
      document.getElementById('authorEdgeClose').onclick = () => {
        cancelAddEdgeMode();
        document.getElementById('authorEdgePanel').hidden = true;
        authorSelectedEdgeIdx = null;
        syncAuthorChrome();
      };

      // Reset view also clears author selection chrome when exiting via chrome
      const resetBtn = document.getElementById('graphResetView');
      const prevReset = resetBtn.onclick;
      resetBtn.onclick = () => {
        if (typeof prevReset === 'function') prevReset();
        // Exit author mode if Shift held — otherwise leave as pan reset only
      };
    })();

    syncAuthorChrome();

    function rebuild() {
      // CSS2D orphan clear before group.clear()
      group.traverse((obj) => {
        if (obj.isCSS2DObject && obj.element) obj.element.remove();
      });
      clearCss2dIn(roleHold);
      clearCss2dIn(graphHold);
      clearCss2dIn(materialsRoot);
      clearCss2dIn(outputRoot);
      clearCss2dIn(machineRoot);
      while (labelRenderer.domElement.firstChild) {
        labelRenderer.domElement.removeChild(labelRenderer.domElement.firstChild);
      }
      // If modal open, close first so roots aren't mid-reparent
      if (modalOpen) closeRoleModal(true);

      overviewRoot.clear();
      roleHold.clear();
      materialsRoot = new THREE.Group();
      outputRoot = new THREE.Group();
      machineRoot = new THREE.Group();
      roleHold.add(materialsRoot, outputRoot, machineRoot);

      const view = STEPS[step].view;
      const mv = STEPS[step].machineVisual;
      const saw = hasSawVisual(mv);
      const showMachineCard = mv !== 'none';

      const { pA, pB, pC, h, c } = hexPoints();
      const up = new THREE.Vector3(0, 1, 0);

      setMachineHud(null);

      // --- MATERIALS ---
      woodTarget = materialsRoot;
      machineTarget = machineRoot;
      let matCall = '';
      let outCall = '';
      let machCall = '';
      let showMaterials = true;
      let showOutput = true;

      if (view === 'stock' && mv === 'tableRip') {
        // Materials: full-width blank; Output: ripped halves (video cut-then-rip)
        addMaterialsPad(1.15, 1.0);
        const blankIn = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.18, 0.42), woodMat);
        blankIn.position.set(0.05, 0.11, 0);
        woodTarget.add(blankIn);
        addDarkOutline(blankIn);
        const blankQty = RAW_STOCK_QTY * BLANKS_PER_BOARD;
        woodTarget.add(makeLabel(`blank ${blankWhlLabel()}`, new THREE.Vector3(0.05, 0.38, 0)));
        matCall = `${blankQty} · ${blankWhlLabel()}`;

        woodTarget = outputRoot;
        addMaterialsPad(1.0, 0.9);
        [-0.16, 0.16].forEach((x, i) => {
          const half = new THREE.Mesh(
            new THREE.BoxGeometry(STOCK_W / 1000 * 8, STRUT_H / 1000 * 6, 0.55),
            woodMat
          );
          half.position.set(x, 0.1, 0);
          woodTarget.add(half);
          addDarkOutline(half);
          woodTarget.add(makeLabel(i === 0 ? halfDimsLabel() : 'matched pair', new THREE.Vector3(x, 0.32, 0)));
        });
        outCall = `${blankQty * 2} · ${halfDimsLabel()}`;
      } else if (view === 'stock' && mv === 'none') {
        // Optional finish — Output-focused stained matched pairs (short halves)
        showMaterials = false;
        woodTarget = outputRoot;
        [-0.15, 0.15].forEach((x, i) => {
          const half = new THREE.Mesh(
            new THREE.BoxGeometry(STOCK_W / 1000, STRUT_H / 1000, BLANK_LEN / 1000),
            stainMat
          );
          half.position.set(x, STRUT_H / 2000, 0);
          woodTarget.add(half);
          woodTarget.add(makeLabel(i === 0 ? `${halfDimsLabel()} stained` : 'matched pair', new THREE.Vector3(x, 0.08, 0.4)));
        });
        outCall = `matched pair · ${halfDimsLabel()}`;
      } else if (view === 'blanks') {
        // Materials: PDF full 2×6; Output: cut blank at HEX.a
        addMaterialsPad(1.0, 0.9);
        const stockIn = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.14, 0.36), woodMat);
        stockIn.position.set(0, 0.09, 0);
        woodTarget.add(stockIn);
        addDarkOutline(stockIn);
        woodTarget.add(makeLabel(`PDF 2×6 ${stockDimsLabel()}`, new THREE.Vector3(0, 0.28, 0)));
        matCall = `input · ${stockDimsLabel()}`;

        woodTarget = outputRoot;
        addMaterialsPad(1.15, 1.0);
        const blank = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.18, 0.42), woodMat);
        blank.position.set(0.05, 0.11, 0);
        woodTarget.add(blank);
        addDarkOutline(blank);
        const blankQty = RAW_STOCK_QTY * BLANKS_PER_BOARD;
        woodTarget.add(makeLabel(`full 2×6 blank  w × h × l`, new THREE.Vector3(0.05, 0.42, 0)));
        woodTarget.add(makeLabel(blankWhlLabel(), new THREE.Vector3(0.05, 0.32, 0)));
        woodTarget.add(makeLabel(`1 of ${blankQty} shown  (panels need ${HEX.qty * 3})`, new THREE.Vector3(0.05, -0.08, 0)));
        outCall = `${blankQty} · ${blankWhlLabel()}`;
      } else if (view === 'bevel') {
        const halfLbl = halfDimsLabel();
        const finLbl = units === 'mm' ? `${STRUT_H}×${STRUT_W} mm` : `${STRUT_H_IN} × ${STRUT_W_IN}`;
        addMaterialsPad(1.0, 0.9);
        const halfIn = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.22, 0.18), woodMat);
        halfIn.position.set(0, 0.13, 0);
        woodTarget.add(halfIn);
        woodTarget.add(makeLabel(`ripped half ${halfLbl}`, new THREE.Vector3(0, 0.38, 0)));
        matCall = halfLbl;

        woodTarget = outputRoot;
        addMaterialsPad(1.1, 0.9);
        const finished = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.22, 0.18), woodMat);
        finished.position.set(-0.04, 0.13, 0);
        woodTarget.add(finished);
        const bevelEdge = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.22, 0.18), bevelMat);
        bevelEdge.position.set(0.07, 0.13, 0);
        woodTarget.add(bevelEdge);
        woodTarget.add(makeLabel(`template ${finLbl}`, new THREE.Vector3(0.02, 0.38, 0)));
        woodTarget.add(makeLabel(`${BEVEL_DEG}° bevel out`, new THREE.Vector3(0.02, -0.08, 0)));
        outCall = `${finLbl} + ${BEVEL_DEG}°`;
      } else if (view === 'jig') {
        addJig(pA, pB, pC, h, c, false);
        woodTarget.add(makeLabel('arc ∩ = apex', pC.clone().add(new THREE.Vector3(0, 0.08, 0.05))));
        matCall = `base ${fmt(HEX.c)} · arcs ${fmt(HEX.a)}`;
        showOutput = false;
      } else if (view === 'jigStops') {
        showMaterials = false;
        woodTarget = outputRoot;
        addJig(pA, pB, pC, h, c, true);
        woodTarget.add(placeStrut(pA, pB, up), placeStrut(pB, pC, up), placeStrut(pC, pA, up));
        outCall = 'jig + backing stops';
      } else if (view === 'mitersBase') {
        addMaterialsPad(1.0, 0.9);
        const blank = new THREE.Mesh(new THREE.BoxGeometry(0.7, STRUT_H / 1000 * 8, STOCK_W / 1000 * 6), woodMat);
        blank.position.set(0, 0.08, 0);
        woodTarget.add(blank);
        addDarkOutline(blank);
        woodTarget.add(makeLabel('beveled blank', new THREE.Vector3(0, 0.28, 0)));
        matCall = `beveled · face ${fmt(STRUT_W)}`;

        woodTarget = outputRoot;
        addJig(pA, pB, pC, h, c, false, false);
        const s1 = placeStrut(pA, pB, up);
        s1.position.z -= 0.22;
        woodTarget.add(s1);
        woodTarget.add(makeLabel(`base ${HEX.base}°`, pA.clone().add(new THREE.Vector3(-0.08, 0.08, 0))));
        woodTarget.add(makeLabel(`base ${HEX.base}°`, pB.clone().add(new THREE.Vector3(0.08, 0.08, 0))));
        outCall = `${HEX.qty * 2} · base ${HEX.base}°`;
      } else if (view === 'mitersApex') {
        addMaterialsPad(1.0, 0.9);
        const blank = new THREE.Mesh(new THREE.BoxGeometry(0.7, STRUT_H / 1000 * 8, STOCK_W / 1000 * 6), woodMat);
        blank.position.set(0, 0.08, 0);
        woodTarget.add(blank);
        addDarkOutline(blank);
        woodTarget.add(makeLabel('beveled blank', new THREE.Vector3(0, 0.28, 0)));
        matCall = `beveled · face ${fmt(STRUT_W)}`;

        woodTarget = outputRoot;
        addJig(pA, pB, pC, h, c, false, false);
        const s2 = placeStrut(pB, pC, up);
        const s3 = placeStrut(pC, pA, up);
        s2.position.x += 0.22;
        s3.position.x -= 0.22;
        woodTarget.add(s2, s3);
        woodTarget.add(makeLabel(`apex ${HEX.apex}°`, pC.clone().add(new THREE.Vector3(0, 0.08, 0.04))));
        outCall = `${HEX.qty} · apex ${HEX.apex}°`;
      } else if (view === 'ears') {
        addJig(pA, pB, pC, h, c, false, false);
        woodTarget.add(placeStrut(pA, pB, up), placeStrut(pB, pC, up), placeStrut(pC, pA, up));
        matCall = `miters ${HEX.base}° / ${HEX.apex}°`;

        woodTarget = outputRoot;
        addJig(pA, pB, pC, h, c, false, false);
        woodTarget.add(placeStrut(pA, pB, up), placeStrut(pB, pC, up), placeStrut(pC, pA, up));
        woodTarget.add(makeLabel(`apex miter ${HEX.apex}°`, pC.clone().add(new THREE.Vector3(0, 0.08, 0.04))));
        woodTarget.add(makeLabel(`base miter ${HEX.base}°`, pA.clone().add(new THREE.Vector3(-0.1, 0.08, 0))));
        woodTarget.add(makeLabel(`base miter ${HEX.base}°`, pB.clone().add(new THREE.Vector3(0.1, 0.08, 0))));
        woodTarget.add(makeLabel(`+ ${BEVEL_DEG}° bevel`, new THREE.Vector3(0, 0.14, h / 2)));
        [pA, pB, pC].forEach((p) => {
          const ear = new THREE.Mesh(new THREE.ConeGeometry(0.018, 0.05, 4), bevelMat);
          ear.position.copy(p);
          ear.position.y = 0.03;
          woodTarget.add(ear);
        });
        outCall = `compound ears + ${BEVEL_DEG}°`;
      } else if (view === 'assemble' || view === 'done') {
        if (view === 'assemble') {
          addMaterialsPad(1.0, 0.85);
          const a = placeStrut(pA, pB, up);
          a.position.set(0, STRUT_H / 2000, 0);
          // simple loose strut cue
          const loose = new THREE.Mesh(new THREE.BoxGeometry(0.55, STRUT_H / 1000, STRUT_W / 1000), woodMat);
          loose.position.set(0, 0.06, 0);
          woodTarget.add(loose);
          addDarkOutline(loose);
          woodTarget.add(makeLabel('finished struts', new THREE.Vector3(0, 0.22, 0)));
          matCall = 'finished struts';
        } else {
          showMaterials = false;
        }
        woodTarget = outputRoot;
        addJig(pA, pB, pC, h, c, true);
        woodTarget.add(placeStrut(pA, pB, up), placeStrut(pB, pC, up), placeStrut(pC, pA, up));
        if (view === 'done') {
          woodTarget.add(makeLabel(`${HEX.qty} incl. 4 windows`, new THREE.Vector3(0, 0.2, h / 2)));
          outCall = `${HEX.qty} hex panels`;
        } else {
          outCall = 'assembled frame';
        }
      } else {
        // fallback
        showMaterials = false;
        showOutput = false;
      }

      // --- MACHINE ---
      machineTarget = machineRoot;
      if (showMachineCard) {
        addMachineVisual(mv);
        if (mv === 'tableRip') machCall = `${TOOL_TABLE_SAW} · rip`;
        else if (mv === 'tableBevel') machCall = `${TOOL_TABLE_SAW} · ${BEVEL_DEG}°`;
        else if (mv === 'miterCrosscut') machCall = `${TOOL_MITER_SAW} · crosscut`;
        else if (mv === 'miterBase') machCall = `${TOOL_MITER_SAW} · base ${HEX.base}°`;
        else if (mv === 'miterApex') machCall = `${TOOL_MITER_SAW} · apex ${HEX.apex}°`;
        else if (mv === 'miterSimple') machCall = `${TOOL_MITER_SAW} · miters`;
        else if (mv === 'miterCompound') machCall = `${TOOL_MITER_SAW} · compound`;
        else if (mv === 'handLayout') machCall = 'hand layout · no saw';
        else if (mv === 'drill') machCall = 'drill / driver';
        else machCall = 'machine';
      }

      setRoleMeta('materials', matCall, showMaterials && materialsRoot.children.length > 0);
      setRoleMeta('machine', machCall, showMachineCard && machineRoot.children.length > 0);
      setRoleMeta('output', outCall, showOutput && outputRoot.children.length > 0);

      // Quiet main overview: materials (or output if no materials), centered
      overviewRoot.clear();
      const grid = new THREE.GridHelper(3.2, 12, 0x2a3140, 0x1a1e26);
      grid.position.y = -0.02;
      overviewRoot.add(grid);
      const focus = roleState.materials.visible ? materialsRoot
        : (roleState.output.visible ? outputRoot : machineRoot);
      if (focus && focus.children.length) {
        // Clone for overview so role roots stay in roleHold
        const clone = focus.clone(true);
        // Strip CSS2D clones (DOM would duplicate)
        const strip = [];
        clone.traverse((o) => { if (o.isCSS2DObject) strip.push(o); });
        strip.forEach((o) => o.parent && o.parent.remove(o));
        overviewRoot.add(clone);
      }

      // Frame quiet overview
      camera.position.set(1.35, 1.15, 1.85);
      controls.target.set(0, 0.25, 0);

      // Primary chrome: whole-guide directed multigraph
      rebuildGraphPreviews();
      highlightGraphForStep();
    }

    // --- Modal interactive view ---
    const modalEl = document.getElementById('roleModal');
    const modalCanvas = document.getElementById('roleModalCanvas');
    const modalRenderer = new THREE.WebGLRenderer({ canvas: modalCanvas, antialias: true });
    modalRenderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    const modalLabelRenderer = new CSS2DRenderer();
    modalLabelRenderer.domElement.style.position = 'absolute';
    modalLabelRenderer.domElement.style.inset = '0';
    modalLabelRenderer.domElement.style.pointerEvents = 'none';
    document.querySelector('.role-modal-canvas-wrap').appendChild(modalLabelRenderer.domElement);

    const modalScene = new THREE.Scene();
    modalScene.background = new THREE.Color(themeSceneHex());
    modalScene.add(new THREE.HemisphereLight(0xc8d4e8, 0x2a2118, 1.1));
    const mSun = new THREE.DirectionalLight(0xfff3e0, 1.4);
    mSun.position.set(2, 3, 2);
    modalScene.add(mSun);
    modalScene.add(new THREE.AmbientLight(0xffffff, 0.25));
    const modalCam = new THREE.PerspectiveCamera(45, 1, 0.01, 50);
    const modalControls = new OrbitControls(modalCam, modalRenderer.domElement);
    modalControls.enableDamping = true;
    let modalOpen = false;
    let modalRole = null;
    const modalHost = new THREE.Group();
    modalScene.add(modalHost);

    function resizeModal() {
      if (!modalOpen) return;
      const wrap = document.querySelector('.role-modal-canvas-wrap');
      const w = (wrap && wrap.clientWidth) || 800;
      const h = (wrap && wrap.clientHeight) || 560;
      modalRenderer.setSize(w, h, false);
      modalLabelRenderer.setSize(w, h);
      modalCam.aspect = w / h;
      modalCam.updateProjectionMatrix();
    }

    function presentModalRoot(root, title) {
      if (!root) return;
      // Clear prior CSS2D in modal host
      clearCss2dIn(modalHost);
      while (modalLabelRenderer.domElement.firstChild) {
        modalLabelRenderer.domElement.removeChild(modalLabelRenderer.domElement.firstChild);
      }
      modalHost.clear();

      document.getElementById('roleModalTitle').textContent = title || 'Preview';
      modalHost.add(root);
      root.visible = true;

      fitIsoCamera(modalCam, root, 1.4);
      modalControls.target.set(0, 0.2, 0);
      const box = new THREE.Box3().setFromObject(root);
      if (!box.isEmpty()) modalControls.target.copy(box.getCenter(new THREE.Vector3()));
      modalControls.update();

      modalOpen = true;
      if (typeof modalEl.showModal === 'function') modalEl.showModal();
      else modalEl.setAttribute('open', '');
      resizeModal();
    }

    function openRoleModal(role) {
      const root = role === 'materials' ? materialsRoot
        : role === 'machine' ? machineRoot : outputRoot;
      if (!root || !roleState[role].visible) return;
      graphModalNodeId = null;
      modalRole = role;
      const title = roleState[role].title + (roleState[role].callout ? ' — ' + roleState[role].callout : '');
      if (role === 'machine') fillModalSide({ kind: 'machine', stepObj: STEPS[step] });
      else fillModalSide(null);
      syncEditChrome(null);
      presentModalRoot(root, title);
    }

    function openGraphNodeModal(nodeId) {
      const st = graphNodeState.get(nodeId);
      const n = nodeById(nodeId);
      if (!st || !st.root || !n) return;
      modalRole = null;
      graphModalNodeId = nodeId;
      window.__graphStepDirty = false;
      // Jump step chrome to related step without fighting graph
      if (typeof n.stepId === 'number' && n.stepId !== step) {
        step = n.stepId;
        window.__graphStepDirty = true;
        document.getElementById('uIN').classList.toggle('active', units === 'in');
        document.getElementById('uMM').classList.toggle('active', units === 'mm');
        renderSteps();
        setDims();
        setMachineSetup();
        // Defer full rebuild until modal closes — keep this node's root alive
        highlightGraphForStep();
      }
      const title = `${n.kind === 'machine' ? 'Machine' : 'Material'}: ${n.title}` +
        (st.callout ? ' — ' + st.callout : '');
      // Machine → Machine Setup; material → Material list (info BELOW 3D)
      if (n.kind === 'machine' && typeof n.stepId === 'number') {
        fillModalSide({ kind: 'machine', stepObj: STEPS[n.stepId], node: n });
      } else if (n.kind === 'material') {
        fillModalSide({ kind: 'material', node: n });
      } else {
        fillModalSide(null);
      }
      syncEditChrome(n);
      presentModalRoot(st.root, title);
    }

    function closeRoleModal(silent) {
      if (!modalOpen && !modalEl.open) return;
      // Clear CSS2D before moving group back
      clearCss2dIn(modalHost);
      while (modalLabelRenderer.domElement.firstChild) {
        modalLabelRenderer.domElement.removeChild(modalLabelRenderer.domElement.firstChild);
      }
      // Return role roots to hold
      if (materialsRoot.parent === modalHost) roleHold.add(materialsRoot);
      if (machineRoot.parent === modalHost) roleHold.add(machineRoot);
      if (outputRoot.parent === modalHost) roleHold.add(outputRoot);
      // Return graph node root
      if (graphModalNodeId) {
        const st = graphNodeState.get(graphModalNodeId);
        if (st && st.root.parent === modalHost) graphHold.add(st.root);
      }
      modalHost.clear();
      fillModalSide(null);
      const wasGraph = graphModalNodeId;
      modalRole = null;
      graphModalNodeId = null;
      modalOpen = false;
      if (modalEl.open) modalEl.close();
      // If we changed step while modal open, sync fully now
      if (wasGraph && !silent && window.__graphStepDirty) {
        window.__graphStepDirty = false;
        rebuild();
      }
    }

    document.getElementById('roleModalClose').onclick = () => closeRoleModal();
    modalEl.addEventListener('cancel', (e) => { e.preventDefault(); closeRoleModal(); });
    modalEl.addEventListener('click', (e) => {
      if (e.target === modalEl) closeRoleModal();
    });
    const rmeApply = document.getElementById('rmeApply');
    const rmeUndo = document.getElementById('rmeUndo');
    const rmeReset = document.getElementById('rmeReset');
    if (rmeApply) rmeApply.onclick = () => { onEditApply(); };
    if (rmeUndo) rmeUndo.onclick = () => { onEditUndo(); };
    if (rmeReset) rmeReset.onclick = () => { onEditReset(); };

    function fullHexSummary() {
      return [
        `Hex ×${HEX.qty} including 4 windows`,
        `Sides: ${fmt(HEX.a)} / ${fmt(HEX.b)} / base ${fmt(HEX.c)}`,
        `Miters off 90°: apex ${HEX.apex}° · bases ${HEX.base}° / ${HEX.base}°`,
        `Stock: PDF (${RAW_STOCK_QTY}) 2×6 ×${fmt(RAW_STOCK_LEN)} → cut ${fmt(BLANK_LEN)} → rip ${fmt(STRUT_H)} × ${fmt(STOCK_W)} · bevel ${BEVEL_DEG}° → finished ${fmt(STRUT_H)} × ${fmt(STRUT_W)}`
      ].join('\n');
    }

    /** Build machineSetup content from a STEPS entry; null if empty. */
    function machineSetupContent(s) {
      if (!s || !s.machineSetup) return null;
      const ms = s.machineSetup;
      const tools = (typeof ms.machines === 'function' ? ms.machines() : ms.machines) || '';
      const settings = (typeof ms.settings === 'function' ? ms.settings() : ms.settings) || [];
      if (!tools && (!settings || settings.length === 0)) return null;
      const title = (!tools || /none/i.test(tools)) ? 'Prep / Staging' : 'Machine setup';
      return { title, tools, settings };
    }

    /**
     * Material list / callout for graph materialKey — qty + dims from panel-specs
     * helpers (fmt / STOCK_W / RAW_STOCK_QTY / etc.). Do not invent dims.
     */
    function materialListContent(n) {
      if (!n || n.kind !== 'material' || !n.materialKey) return null;
      const k = n.materialKey;
      const title = 'Materials';
      /** @type {string[]} */
      let lines = [];
      if (k === 'pdf-2x6') {
        lines = [
          `Qty: (${RAW_STOCK_QTY})`,
          `Dims: ${stockDimsLabel()}`,
          'Kiln-dried 2×6 · PDF stock'
        ];
      } else if (k === 'ripped-half') {
        lines = [
          `Qty: ${RAW_STOCK_QTY * BLANKS_PER_BOARD * 2}`,
          `Dims: ${halfDimsLabel()}`,
          'Short halves after rip of blanks · matched pairs'
        ];
      } else if (k === 'optional-finish') {
        lines = [
          'Qty: matched pair',
          `Dims: ${halfDimsLabel()}`
        ];
      } else if (k === 'blank') {
        lines = [
          `Qty: ${RAW_STOCK_QTY * BLANKS_PER_BOARD}`,
          `Dims: ${blankWhlLabel()}`,
          `Full 2×6 × ${fmt(BLANK_LEN)} · panels need ${HEX.qty * 3}`
        ];
      } else if (k === 'leftover') {
        lines = [
          `Qty: ${RAW_STOCK_QTY}`,
          `Dims: ${leftoverWhlLabel()}`,
          `Note: ${leftoverSawdustNote()}`,
          `After ${BLANKS_PER_BOARD}× blanks / board (RAW−n×BLANK−n×kerf)`
        ];
      } else if (k === 'beveled') {
        lines = [
          `Dims: ${finishedDimsLabel()} + ${BEVEL_DEG}°`
        ];
      } else if (k === 'jig') {
        lines = [
          `Base ${fmt(HEX.c)}`,
          `Arcs ${fmt(HEX.a)} / ${fmt(HEX.b)}`
        ];
      } else if (k === 'jig-stops') {
        lines = ['Jig + backing stops'];
      } else if (k === 'mitered-base') {
        lines = [
          `Qty: ${HEX.qty * 2}`,
          `Dims: ${finishedDimsLabel()}`,
          `Note: ${HEX.base}° base`
        ];
      } else if (k === 'mitered-apex') {
        lines = [
          `Qty: ${HEX.qty}`,
          `Dims: ${finishedDimsLabel()}`,
          `Note: ${HEX.apex}° apex`
        ];
      } else if (k === 'ears') {
        lines = [`Compound ears + ${BEVEL_DEG}°`];
      } else if (k === 'assembled') {
        lines = ['Assembled frame'];
      } else if (k === 'done') {
        lines = [`Qty: ${HEX.qty} hex panels`];
      } else {
        const c = nodeCallout(n);
        if (!c) return null;
        lines = [c];
      }
      return { title, nodeTitle: n.title, lines };
    }

    /**
     * Fill (or hide) the modal side panel: Machine Setup OR Material list.
     * @param {{ kind: 'machine', stepObj: object } | { kind: 'material', node: object } | null} spec
     */
    function overrideTipHtml(ov) {
      if (!ov) return '';
      const bits = [];
      if (ov.note) bits.push(`Note: ${ov.note}`);
      if (ov.qtyLabel) bits.push(`Qty: ${ov.qtyLabel}`);
      if (ov.dimsLabel) bits.push(`Dims: ${ov.dimsLabel}`);
      if (ov.scale != null) bits.push(`Scale: ${ov.scale}`);
      if (ov.highlightColor) bits.push(`Color: ${ov.highlightColor}`);
      if (ov.miterDeg != null) bits.push(`Miter: ${ov.miterDeg}°`);
      if (ov.bevelDeg != null) bits.push(`Bevel: ${ov.bevelDeg}°`);
      if (!bits.length) return '';
      return `<div class="rme-override-tip">Edit overlay — ${bits.join(' · ')}</div>`;
    }

    function setEditStatus(msg, kind) {
      const el = document.getElementById('rmeStatus');
      if (!el) return;
      el.textContent = msg || 'Idle';
      el.classList.toggle('is-error', kind === 'error');
      el.classList.toggle('is-ok', kind === 'ok');
    }

    function syncEditChrome(n) {
      const edit = document.getElementById('roleModalEdit');
      const undoBtn = document.getElementById('rmeUndo');
      const resetBtn = document.getElementById('rmeReset');
      if (!edit || !undoBtn || !resetBtn) return;
      if (!n || (n.kind !== 'material' && n.kind !== 'machine')) {
        edit.hidden = true;
        return;
      }
      edit.hidden = false;
      const key = overrideKey(n.id, n.kind);
      const entry = getOverrideEntry(key);
      undoBtn.disabled = !(entry && entry.history && entry.history.length);
      resetBtn.disabled = !(entry && (entry.current || (entry.history && entry.history.length)));
    }

    function fillModalSide(spec) {
      const panel = document.getElementById('roleModalSetup');
      const setupBody = document.getElementById('roleModalSetupBody');
      const body = document.querySelector('.role-modal-body');
      const edit = document.getElementById('roleModalEdit');
      if (!panel || !body) return;
      const target = setupBody || panel;

      let html = '';
      let mode = '';
      let nodeForEdit = null;
      if (spec && spec.kind === 'machine') {
        const content = machineSetupContent(spec.stepObj);
        nodeForEdit = spec.node || (graphModalNodeId ? nodeById(graphModalNodeId) : null);
        if (content) {
          mode = 'machine';
          const lis = content.settings.map((line) => `<li>${line}</li>`).join('');
          html =
            `<div class="ms-title">${content.title}</div>` +
            (content.tools ? `<div class="ms-tools">${content.tools}</div>` : '') +
            (lis ? `<ul>${lis}</ul>` : '');
        }
      } else if (spec && spec.kind === 'material') {
        const content = materialListContent(spec.node);
        nodeForEdit = spec.node || null;
        if (content) {
          mode = 'material';
          const lis = content.lines.map((line) => `<li>${line}</li>`).join('');
          html =
            `<div class="ms-title">${content.title}</div>` +
            (content.nodeTitle ? `<div class="ms-tools">${content.nodeTitle}</div>` : '') +
            (lis ? `<ul>${lis}</ul>` : '');
        }
      }

      // Append override tip into setup body when present
      if (nodeForEdit) {
        const ov = getCurrentOverride(nodeForEdit.id, nodeForEdit.kind);
        html += overrideTipHtml(ov);
      }

      // Keep .machinesetup for shared ms-* typography; materiallist only tints title
      panel.classList.add('machinesetup');
      panel.classList.toggle('materiallist', mode === 'material');

      const showEdit = !!(nodeForEdit && (nodeForEdit.kind === 'material' || nodeForEdit.kind === 'machine'));
      if (edit) edit.hidden = !showEdit;

      if (!html && !showEdit) {
        if (setupBody) setupBody.innerHTML = '';
        else panel.innerHTML = '';
        panel.hidden = true;
        body.classList.remove('has-setup');
        syncEditChrome(null);
        return;
      }
      panel.hidden = false;
      body.classList.add('has-setup');
      if (setupBody) setupBody.innerHTML = html;
      else panel.innerHTML = html;
      syncEditChrome(nodeForEdit);
    }

    function currentEditNode() {
      if (!graphModalNodeId) return null;
      return nodeById(graphModalNodeId);
    }

    /**
     * Structured shop geometry for Hex Edit (xAI context). Text/JSON only — no mesh/screenshot.
     * Switches on materialKey / machineVisual / id; numbers from panel-specs.
     */
    function buildGeometryContext(n) {
      const key = n.materialKey || null;
      const mv = n.machineVisual || null;
      const wood = '#c48a4a';
      const accent = '#5b3a1e';
      const jig = '#3d5c45';
      const dewalt = '#f5c518';
      const machineBlue = '#6b8caf';
      const COLORS_WOOD = { wood, accent };
      const COLORS_BEVEL = { wood, accent };
      const COLORS_JIG = { wood, accent: jig };
      const COLORS_TABLE = { wood, accent, machine: dewalt };
      const COLORS_MITER = { wood, accent, machine: machineBlue };
      const COLORS_HAND = { wood, accent: jig };
      const COLORS_DRILL = { wood, accent, machine: machineBlue };

      /** @type {Record<string, any>} */
      let g = {
        geometryBrief: 'Authored shop preview for this node. Use callout and dims when present.',
        defaultColors: COLORS_WOOD,
        parts: []
      };

      if (key === 'pdf-2x6') {
        g = {
          geometryBrief: `Stack of (${RAW_STOCK_QTY}) kiln-dried PDF 2×6 boards, ${STRUT_H}×${FULL_2X6_W}×${RAW_STOCK_LEN} mm. Cut blanks to ${BLANK_LEN} mm (= HEX.a) first.`,
          dimsMm: { height: STRUT_H, width: FULL_2X6_W, length: RAW_STOCK_LEN },
          qty: RAW_STOCK_QTY,
          stackCount: RAW_STOCK_QTY,
          stackRows: 1,
          defaultColors: COLORS_WOOD,
          parts: ['PDF 2x6 board']
        };
      } else if (key === 'ripped-half') {
        g = {
          geometryBrief: `Short ripped halves: ${RAW_STOCK_QTY * BLANKS_PER_BOARD} blanks × 2 → ${RAW_STOCK_QTY * BLANKS_PER_BOARD * 2} pieces at ${STRUT_H}×${STOCK_W}×${BLANK_LEN} mm. Keep matched pairs.`,
          dimsMm: { height: STRUT_H, width: STOCK_W, length: BLANK_LEN },
          qty: RAW_STOCK_QTY * BLANKS_PER_BOARD * 2,
          stackCount: Math.min(RAW_STOCK_QTY, 16),
          stackRows: 2,
          defaultColors: COLORS_WOOD,
          parts: ['ripped half']
        };
      } else if (key === 'blank') {
        g = {
          geometryBrief: `${RAW_STOCK_QTY * BLANKS_PER_BOARD} full-width blanks (${BLANK_LEN} mm = HEX.a) from PDF 2×6, section ${FULL_2X6_W}×${STRUT_H} mm before rip. Panels need ${HEX.qty * 3}.`,
          dimsMm: { height: STRUT_H, width: FULL_2X6_W, length: BLANK_LEN },
          qty: RAW_STOCK_QTY * BLANKS_PER_BOARD,
          defaultColors: COLORS_WOOD,
          parts: ['full 2x6 blank']
        };
      } else if (key === 'leftover') {
        g = {
          geometryBrief: `${RAW_STOCK_QTY} leftover remnants after ${BLANKS_PER_BOARD} blank cuts per board — full ${FULL_2X6_W}×${STRUT_H} section × ~${BLANK_STOCK_LEFTOVER} mm.`,
          dimsMm: { height: STRUT_H, width: FULL_2X6_W, length: BLANK_STOCK_LEFTOVER },
          qty: RAW_STOCK_QTY,
          defaultColors: COLORS_WOOD,
          parts: ['leftover stock']
        };
      } else if (key === 'optional-finish') {
        g = {
          geometryBrief: `Optional stain on a matched pair of short ripped halves (${STRUT_H}×${STOCK_W}×${BLANK_LEN} mm) before bevel.`,
          dimsMm: { height: STRUT_H, width: STOCK_W, length: BLANK_LEN },
          qty: 'matched pair',
          defaultColors: COLORS_WOOD,
          parts: ['stained half', 'matched pair']
        };
      } else if (key === 'beveled') {
        g = {
          geometryBrief: `Beveled strut template: finished face ${STRUT_H}×${STRUT_W} mm with ${BEVEL_DEG}° bevel out. Same blank count as stock (${HEX.qty * 3}).`,
          dimsMm: { height: STRUT_H, width: STRUT_W, length: BLANK_LEN },
          qty: HEX.qty * 3,
          bevelDeg: BEVEL_DEG,
          defaultColors: COLORS_BEVEL,
          parts: ['beveled blank', 'bevel edge']
        };
      } else if (key === 'jig') {
        g = {
          geometryBrief: `Plywood layout jig: base marks ${HEX.c} mm apart; arcs at ${HEX.a} mm; apex at arc ∩.`,
          dimsMm: { length: HEX.a, width: HEX.c, height: HEX.b },
          qty: '',
          defaultColors: COLORS_JIG,
          parts: ['jig plywood', 'layout arcs']
        };
      } else if (key === 'jig-stops') {
        g = {
          geometryBrief: `Jig with backing stops and three strut lanes on the hex triangle (${HEX.a}/${HEX.b}/${HEX.c} mm).`,
          dimsMm: { length: HEX.a, width: HEX.c, height: HEX.b },
          qty: '',
          defaultColors: COLORS_JIG,
          parts: ['jig plywood', 'backing stops', 'strut lanes']
        };
      } else if (key === 'mitered-base') {
        g = {
          geometryBrief: `Base-lane strut with simple miters at ${HEX.base}° off 90° (bevel 0°). Batch ${HEX.qty * 2} base ends.`,
          dimsMm: { height: STRUT_H, width: STRUT_W, length: HEX.c },
          qty: HEX.qty * 2,
          miterDeg: HEX.base,
          bevelDeg: 0,
          defaultColors: COLORS_BEVEL,
          parts: ['mitered base strut', 'jig']
        };
      } else if (key === 'mitered-apex') {
        g = {
          geometryBrief: `Apex-lane struts with simple miters at ${HEX.apex}° off 90° (bevel 0°). Batch ${HEX.qty} apex ends.`,
          dimsMm: { height: STRUT_H, width: STRUT_W, length: HEX.a },
          qty: HEX.qty,
          miterDeg: HEX.apex,
          bevelDeg: 0,
          defaultColors: COLORS_BEVEL,
          parts: ['mitered apex strut', 'jig']
        };
      } else if (key === 'ears') {
        g = {
          geometryBrief: `Compound ear trim: keep lane miter (base ${HEX.base}° / apex ${HEX.apex}°) plus ${BEVEL_DEG}° bevel. ${HEX.qty * 3} struts.`,
          dimsMm: { height: STRUT_H, width: STRUT_W, length: HEX.a },
          qty: HEX.qty * 3,
          miterDeg: HEX.apex,
          bevelDeg: BEVEL_DEG,
          defaultColors: COLORS_BEVEL,
          parts: ['ear strut', 'compound ear', 'jig']
        };
      } else if (key === 'assembled') {
        g = {
          geometryBrief: `One assembled hex frame on the jig — sides ${HEX.a} / ${HEX.b} / ${HEX.c} mm with stops.`,
          dimsMm: { length: HEX.a, width: HEX.c, height: HEX.b },
          qty: 1,
          defaultColors: COLORS_JIG,
          parts: ['assembled frame', 'jig', 'backing stops']
        };
      } else if (key === 'done') {
        g = {
          geometryBrief: `Done: ${HEX.qty} hex panels (incl. windows). Frame sides ${HEX.a} / ${HEX.b} / ${HEX.c} mm.`,
          dimsMm: { length: HEX.a, width: HEX.c, height: HEX.b },
          qty: `${HEX.qty} hex panels`,
          defaultColors: COLORS_JIG,
          parts: ['finished hex panel', 'jig']
        };
      } else if (mv === 'tableRip') {
        g = {
          geometryBrief: `${TOOL_TABLE_SAW}: square rip ${BLANK_LEN} mm blanks (${STRUT_H}×${FULL_2X6_W} mm) in half → ${STRUT_H}×${STOCK_W} mm. Fence at half width; bevel 0°. Not full 4 m first.`,
          dimsMm: { height: STRUT_H, width: FULL_2X6_W, length: BLANK_LEN },
          qty: RAW_STOCK_QTY * BLANKS_PER_BOARD,
          bevelDeg: 0,
          defaultColors: COLORS_TABLE,
          parts: ['table saw', 'fence', 'blade', 'full 2x6 blank']
        };
      } else if (mv === 'miterCrosscut') {
        g = {
          geometryBrief: `${TOOL_MITER_SAW}: crosscut PDF 2×6 to ${BLANK_LEN} mm (= HEX.a). Square cut on full section; miter 0° / bevel 0°.`,
          dimsMm: { height: STRUT_H, width: FULL_2X6_W, length: BLANK_LEN },
          qty: RAW_STOCK_QTY * BLANKS_PER_BOARD,
          miterDeg: 0,
          bevelDeg: 0,
          defaultColors: COLORS_MITER,
          parts: ['miter saw', 'fence', 'PDF 2x6 stock', 'blank']
        };
      } else if (mv === 'tableBevel') {
        g = {
          geometryBrief: `${TOOL_TABLE_SAW}: bevel-rip ${BEVEL_DEG}° for finished face ${STRUT_H}×${STRUT_W} mm from ${STRUT_H}×${STOCK_W} blank.`,
          dimsMm: { height: STRUT_H, width: STOCK_W, length: BLANK_LEN },
          qty: HEX.qty * 3,
          bevelDeg: BEVEL_DEG,
          defaultColors: COLORS_TABLE,
          parts: ['table saw', 'bevel scale', 'fence', 'blank']
        };
      } else if (mv === 'miterBase') {
        g = {
          geometryBrief: `${TOOL_MITER_SAW}: simple base miters at ${HEX.base}° off 90°, bevel 0°. Long-point to long-point.`,
          dimsMm: { height: STRUT_H, width: STRUT_W, length: HEX.c },
          qty: HEX.qty * 2,
          miterDeg: HEX.base,
          bevelDeg: 0,
          defaultColors: COLORS_MITER,
          parts: ['miter saw', 'base strut', 'stop block']
        };
      } else if (mv === 'miterApex') {
        g = {
          geometryBrief: `${TOOL_MITER_SAW}: simple apex miters at ${HEX.apex}° off 90°, bevel 0°. Do not trust the ~31.6° stop alone.`,
          dimsMm: { height: STRUT_H, width: STRUT_W, length: HEX.a },
          qty: HEX.qty,
          miterDeg: HEX.apex,
          bevelDeg: 0,
          defaultColors: COLORS_MITER,
          parts: ['miter saw', 'apex strut', 'stop block']
        };
      } else if (mv === 'miterCompound') {
        g = {
          geometryBrief: `${TOOL_MITER_SAW}: compound ear trim — lane miter (base ${HEX.base}° / apex ${HEX.apex}°) + ${BEVEL_DEG}° bevel. Dual bevel L/R.`,
          dimsMm: { height: STRUT_H, width: STRUT_W, length: HEX.a },
          qty: HEX.qty * 3,
          miterDeg: HEX.apex,
          bevelDeg: BEVEL_DEG,
          defaultColors: COLORS_MITER,
          parts: ['miter saw', 'compound ear', 'stop block']
        };
      } else if (mv === 'handLayout') {
        g = {
          geometryBrief: `Hand layout on plywood jig: mark base ${HEX.c} mm, swing arcs ${HEX.a} mm, mark apex at intersection. No saw.`,
          dimsMm: { length: HEX.a, width: HEX.c, height: HEX.b },
          defaultColors: COLORS_HAND,
          parts: ['plywood jig', 'pencil marks', 'trammel']
        };
      } else if (mv === 'drill' || n.id === 'm-drill') {
        g = {
          geometryBrief: `Drill/driver assemble: fasten three struts on the jig into one hex frame (${HEX.a}/${HEX.b}/${HEX.c} mm).`,
          dimsMm: { length: HEX.a, width: HEX.c, height: HEX.b },
          qty: 1,
          defaultColors: COLORS_DRILL,
          parts: ['drill/driver', 'assembled frame', 'jig', 'screws']
        };
      } else if (n.kind === 'machine') {
        g = {
          geometryBrief: `Authored machine schematic (${mv || n.id || 'unknown'}). Overrides may change miter/bevel/scale/labels.`,
          defaultColors: COLORS_MITER,
          parts: ['machine']
        };
      } else {
        g = {
          geometryBrief: `Authored material preview (${key || n.id || 'unknown'}). Overrides may change scale/color/labels/qty/dims/note.`,
          defaultColors: COLORS_WOOD,
          parts: ['material']
        };
      }

      // Drop empty qty so context stays tight
      if (g.qty === '' || g.qty == null) delete g.qty;
      return g;
    }

    function buildEditContext(n) {
      const st = graphNodeState.get(n.id);
      const ov = getCurrentOverride(n.id, n.kind);
      const geom = buildGeometryContext(n);
      return {
        nodeId: n.id,
        kind: n.kind,
        title: n.title,
        callout: (st && st.callout) || nodeCallout(n),
        unitMode: units,
        materialKey: n.materialKey || null,
        machineVisual: n.machineVisual || null,
        currentOverride: ov,
        ...geom
      };
    }

    async function onEditApply() {
      const n = currentEditNode();
      if (!n) return;
      const promptEl = document.getElementById('rmePrompt');
      const prompt = (promptEl && promptEl.value || '').trim();
      if (!prompt) {
        setEditStatus('Enter a short edit prompt', 'error');
        return;
      }
      const applyBtn = document.getElementById('rmeApply');
      if (applyBtn) applyBtn.disabled = true;
      setEditStatus('Applying…', null);
      try {
        const result = await requestHexEdit(prompt, buildEditContext(n));
        if (!result.ok || !result.override) {
          setEditStatus(result.error || 'Apply failed', 'error');
          return;
        }
        const key = overrideKey(n.id, n.kind);
        setOverrideCurrent(key, result.override);
        rebuildGraphNodeLive(n.id);
        setEditStatus(result.mock ? 'Applied (mock)' : 'Applied', 'ok');
      } catch (err) {
        setEditStatus('Apply failed', 'error');
      } finally {
        if (applyBtn) applyBtn.disabled = false;
        syncEditChrome(currentEditNode());
      }
    }

    function onEditUndo() {
      const n = currentEditNode();
      if (!n) return;
      const key = overrideKey(n.id, n.kind);
      if (!undoOverride(key)) {
        setEditStatus('Nothing to undo', 'error');
        syncEditChrome(n);
        return;
      }
      rebuildGraphNodeLive(n.id);
      setEditStatus('Undo done', 'ok');
      syncEditChrome(n);
    }

    function onEditReset() {
      const n = currentEditNode();
      if (!n) return;
      const key = overrideKey(n.id, n.kind);
      if (!resetOverride(key)) {
        setEditStatus('No overrides', 'error');
        syncEditChrome(n);
        return;
      }
      rebuildGraphNodeLive(n.id);
      setEditStatus('Reset to original', 'ok');
      syncEditChrome(n);
    }

    /** Sidebar Machine Setup removed — lives in machine-node modal. */
    function setMachineSetup() { /* no-op: setup shown in roleModal */ }

    function setDims() {
      const el = document.getElementById('hexMetaBody');
      if (el) el.textContent = fullHexSummary();
    }

    function renderSteps() {
      const wrap = document.getElementById('steps');
      wrap.innerHTML = '';
      STEPS.forEach((s) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'step' + (s.id === step ? ' active' : '');
        b.textContent = s.title;
        b.onclick = () => { step = s.id; sync(); };
        wrap.appendChild(b);
      });
    }

    function sync() {
      const reopenNodeId = graphModalNodeId;
      const reopenRole = modalRole;
      document.getElementById('uIN').classList.toggle('active', units === 'in');
      document.getElementById('uMM').classList.toggle('active', units === 'mm');
      renderSteps();
      setDims();
      setMachineSetup();
      rebuild();
      // Unit toggle (and theme) refresh side-panel text via reopen
      if (reopenNodeId) openGraphNodeModal(reopenNodeId);
      else if (reopenRole) openRoleModal(reopenRole);
    }

    function applyThemeScenes() {
      const sceneHex = themeSceneHex();
      const previewHex = themePreviewHex();
      scene.background = new THREE.Color(sceneHex);
      modalScene.background = new THREE.Color(sceneHex);
      previewScene.background = new THREE.Color(previewHex);
      if (renderer && renderer.setClearColor) renderer.setClearColor(sceneHex, 1);
      if (modalRenderer && modalRenderer.setClearColor) modalRenderer.setClearColor(sceneHex, 1);
    }

    function setTheme(next) {
      theme = next === 'light' ? 'light' : 'dark';
      try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
      applyThemeDom();
      applyThemeScenes();
      // Rebuild so CSS2D labels + graph previews pick up new bg/colors
      sync();
    }

    function setUnits(next) {
      units = next === 'in' ? 'in' : 'mm';
      try { localStorage.setItem(UNITS_KEY, units); } catch (e) {}
      sync();
    }
    document.getElementById('uIN').onclick = () => { setUnits('in'); };
    document.getElementById('uMM').onclick = () => { setUnits('mm'); };
    const btnThemeLight = document.getElementById('btnThemeLight');
    const btnThemeDark = document.getElementById('btnThemeDark');
    if (btnThemeLight) btnThemeLight.onclick = () => { setTheme('light'); };
    if (btnThemeDark) btnThemeDark.onclick = () => { setTheme('dark'); };
    const settingsModal = document.getElementById('settingsModal');
    const btnSettings = document.getElementById('btnSettings');
    const settingsModalClose = document.getElementById('settingsModalClose');
    function openSettingsModal() {
      if (!settingsModal) return;
      if (typeof settingsModal.showModal === 'function') settingsModal.showModal();
      else settingsModal.setAttribute('open', '');
    }
    function closeSettingsModal() {
      if (!settingsModal) return;
      if (typeof settingsModal.close === 'function') settingsModal.close();
      else settingsModal.removeAttribute('open');
    }
    if (btnSettings) btnSettings.onclick = () => { openSettingsModal(); };
    if (settingsModalClose) settingsModalClose.onclick = () => { closeSettingsModal(); };
    if (settingsModal) {
      settingsModal.addEventListener('click', (e) => {
        if (e.target === settingsModal) closeSettingsModal();
      });
    }
    document.getElementById('btnSidebarToggle').onclick = () => {
      setSidebarCollapsed(!sidebarCollapsed);
    };
    applyThemeScenes();
    // Fit graph after first layout (main viewport)
    requestAnimationFrame(() => {
      try { fitGraphView(); } catch (e) {}
      requestAnimationFrame(() => { try { fitGraphView(); } catch (e) {} });
    });

    let _graphResizeTimer = 0;
    function resize() {
      const w = Math.max(1, innerWidth);
      const h = Math.max(1, innerHeight);
      renderer.setSize(2, 2, false);
      labelRenderer.setSize(2, 2);
      camera.aspect = 1;
      camera.updateProjectionMatrix();
      resizeModal();
      clearTimeout(_graphResizeTimer);
      _graphResizeTimer = setTimeout(() => {
        try { fitGraphView(); } catch (e) {}
      }, 80);
    }
    addEventListener('resize', resize);
    resize();
    sync();

    (function loop() {
      requestAnimationFrame(loop);
      if (window.__pause) return;
      controls.update();
      renderer.render(scene, camera);
      labelRenderer.render(scene, camera);
      if (modalOpen) {
        modalControls.update();
        modalRenderer.render(modalScene, modalCam);
        modalLabelRenderer.render(modalScene, modalCam);
      }
    })();

</script>
</body>
