<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trillium 5/8 3v — Hex panel frames</title>
  <style>
    :root {
      --bg: #121418;
      --panel: #1c2028;
      --line: #2e3542;
      --text: #e8eaed;
      --muted: #9aa3b2;
      --hex: #3d8bfd;
      --pent: #f0a202;
      --wood: #c48a4a;
      --accent: #7dcea0;
      --btn: #2a3140;
      --btn-active: #3a5a8a;
      --btn-hover-border: #4a5568;
      --inset: #161a22;
      --preview-bg: #0e1014;
      --preview-border: #252b36;
      --modal-bg: #121418;
      --modal-bar: #1c2028;
      --machine-card: #f5c518;
      --backdrop: #00000099;
      --label-bg: #1c2028cc;
      --label-fg: #e8eaed;
      --label-border: #2e3542;
      --scene-bg: #121418;
    }
    html[data-theme="light"] {
      --bg: #eef0f3;
      --panel: #ffffff;
      --line: #c5cad3;
      --text: #1a1d24;
      --muted: #5c6570;
      --hex: #1a6fd4;
      --pent: #b86a00;
      --wood: #8b5a2b;
      --accent: #2a8f5c;
      --btn: #e4e7ec;
      --btn-active: #c8daf0;
      --btn-hover-border: #8a93a3;
      --inset: #f4f6f8;
      --preview-bg: #e4e7ec;
      --preview-border: #c5cad3;
      --modal-bg: #eef0f3;
      --modal-bar: #ffffff;
      --machine-card: #b8860b;
      --backdrop: #00000055;
      --label-bg: #ffffffee;
      --label-fg: #1a1d24;
      --label-border: #c5cad3;
      --scene-bg: #eef0f3;
    }
    * { box-sizing: border-box; }
    *, *::before, *::after { border-radius: 0 !important; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
    /* App shell: compact sidebar + graph as primary main viewport */
    .app {
      display: flex;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
    }
    /* Quiet main Three.js overview — kept for rebuild/preview plumbing, not primary UI */
    #c {
      position: fixed;
      width: 1px; height: 1px;
      opacity: 0; pointer-events: none;
      left: -9999px; top: -9999px;
    }
    .ui {
      flex: 0 0 min(320px, 34vw);
      width: min(320px, 34vw);
      max-width: 360px;
      min-width: 260px;
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 10px 12px;
      overflow: auto;
      z-index: 6;
      height: 100%;
      transition: flex-basis 0.18s ease, width 0.18s ease, min-width 0.18s ease, max-width 0.18s ease, padding 0.18s ease;
    }
    .ui-head {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 0 0 8px;
    }
    .ui-head h1 { flex: 1 1 auto; margin: 0; min-width: 0; }
    .ui-collapse-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      padding: 0;
      line-height: 0;
    }
    .ui-collapse-btn .ui-menu-icon {
      display: block;
      width: 18px;
      height: 18px;
      color: inherit;
      pointer-events: none;
    }
    /* Collapsed: slim reopen rail; graph-main grows via flex */
    .app.sidebar-collapsed .ui {
      flex: 0 0 44px;
      width: 44px;
      min-width: 44px;
      max-width: 44px;
      padding: 8px 4px;
      overflow: hidden;
    }
    .app.sidebar-collapsed .ui > *:not(.ui-head) {
      display: none !important;
    }
    .app.sidebar-collapsed .ui-head {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      margin: 0;
      height: auto;
    }
    .app.sidebar-collapsed .ui-head h1 {
      display: none !important;
    }
    .app.sidebar-collapsed .ui-collapse-btn {
      width: 100%;
      height: 36px;
      flex: 0 0 auto;
      writing-mode: horizontal-tb;
      transform: none;
      padding: 0;
      letter-spacing: normal;
    }
    .graph-main {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      background: var(--bg);
    }
    h1 { font-size: 15px; margin: 0 0 8px; font-weight: 650; }
    h2 { font-size: 12px; margin: 12px 0 6px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    button {
      background: var(--btn); color: var(--text); border: 1px solid var(--line);
      border-radius: 0; padding: 6px 10px; cursor: pointer; font: inherit;
    }
    button:hover:not(:disabled) { border-color: var(--btn-hover-border); }
    button.active { background: var(--btn-active); border-color: var(--hex); }
    button.secondary { opacity: 0.45; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    .step { width: 100%; text-align: left; font-size: 12px; padding: 5px 8px; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
    .hint a { color: var(--accent); }
    .legend span { display: inline-block; width: 10px; height: 10px; border-radius: 0; margin-right: 4px; vertical-align: middle; }
    .badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 0; background: var(--btn); color: var(--muted); margin-left: 4px; }
    .machinesetup {
      background: var(--inset); border: 1px solid var(--hex); border-radius: 0;
      padding: 8px 10px; margin-top: 8px; font-size: 12px;
    }
    .machinesetup .ms-title {
      font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--hex); margin: 0 0 6px;
    }
    .machinesetup .ms-tools { color: var(--text); font-weight: 600; margin: 0 0 4px; }
    .machinesetup ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); }
    .machinesetup li { margin: 2px 0; }
    .machine-hud { display: none !important; }
    .vizrow { display: none !important; }
    .hex-meta {
      margin: 8px 0 0; border: 1px solid var(--line); border-radius: 0;
      background: var(--inset); padding: 6px 10px; font-size: 12px; color: var(--muted);
    }
    .hex-meta summary {
      cursor: pointer; font-weight: 650; color: var(--text);
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .hex-meta .meta-body { white-space: pre-wrap; margin-top: 6px; }
    .split-chrome { display: none !important; }

    .flow-hint { font-size: 11px; color: var(--muted); margin: 0 0 4px; }

    /* Directed multigraph shop sequence — primary main viewport */
    .graph-shell {
      flex: 1 1 auto;
      margin: 0;
      border: none;
      border-radius: 0;
      background: var(--inset);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
    }
    .graph-toolbar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 8px 12px; border-bottom: 1px solid var(--line);
      font-size: 11px; color: var(--muted);
      background: var(--panel);
      flex: 0 0 auto;
    }
    .graph-toolbar strong { color: var(--text); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
    .graph-toolbar button { padding: 4px 10px; font-size: 11px; }
    .graph-toolbar .graph-spacer { flex: 1 1 auto; }
    .graph-viewport {
      position: relative;
      flex: 1 1 auto;
      height: auto;
      min-height: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      background:
        radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--line) 70%, transparent) 1px, transparent 0) 0 0 / 18px 18px;
    }
    .graph-viewport.panning { cursor: grabbing; }
    .graph-world {
      position: absolute; left: 0; top: 0;
      transform-origin: 0 0;
      will-change: transform;
    }
    .graph-edges {
      position: absolute; left: 0; top: 0;
      overflow: visible;
      pointer-events: none;
    }
    .graph-edges path {
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.6;
      opacity: 0.85;
    }
    .graph-edges path.fan {
      stroke: var(--accent);
      stroke-width: 2;
      opacity: 1;
    }
    .graph-edges marker path { fill: var(--muted); }
    .graph-node {
      position: absolute;
      width: 132px;
      padding: 6px;
      border-radius: 0;
      border: 1px solid var(--line);
      background: var(--panel);
      color: inherit;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 2px 10px #00000033;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .graph-node:hover { border-color: var(--btn-hover-border); }
    .graph-node:focus-visible { outline: 2px solid var(--hex); outline-offset: 2px; }
    .graph-node.material { border-color: color-mix(in srgb, var(--wood) 55%, var(--line)); }
    .graph-node.machine { border-color: color-mix(in srgb, var(--machine-card) 60%, var(--line)); }
    .graph-node.active {
      border-color: var(--hex);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--hex) 45%, transparent);
    }
    .graph-node.author-selected {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent);
      z-index: 2;
    }
    .graph-shell.author-mode .graph-node { cursor: grab; }
    .graph-shell.author-mode .graph-node.dragging { cursor: grabbing; }
    .graph-shell.author-mode .graph-edges { pointer-events: auto; }
    .graph-shell.author-mode .graph-edges path { pointer-events: stroke; cursor: pointer; }
    .graph-toolbar .author-toolbar {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .graph-toolbar .author-toolbar[hidden],
    .graph-toolbar .author-badge[hidden],
    .author-hint[hidden] { display: none !important; }
    .graph-toolbar .author-badge {
      color: var(--accent); font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase; font-size: 11px;
    }
    .graph-toolbar button.author-tool-active {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 18%, var(--btn));
    }
    .author-hint {
      font-size: 11px; color: var(--accent); margin: 0 4px;
    }
    .author-panel {
      position: absolute; z-index: 20; top: 48px; right: 12px;
      width: min(360px, calc(100% - 24px));
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 0; box-shadow: 0 8px 28px #00000055;
      padding: 10px 12px; font-size: 12px; color: var(--text);
      display: flex; flex-direction: column; gap: 8px;
      max-height: calc(100% - 64px); overflow: auto;
    }
    .author-panel[hidden] { display: none !important; }
    .author-panel h3 {
      margin: 0; font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--muted);
    }
    .author-panel label {
      display: flex; flex-direction: column; gap: 3px;
      font-size: 11px; color: var(--muted);
    }
    .author-panel label[hidden] { display: none !important; }
    .author-panel input, .author-panel select, .author-panel textarea {
      font: inherit; color: var(--text); background: var(--inset);
      border: 1px solid var(--line); border-radius: 0; padding: 5px 8px;
    }
    .author-panel textarea { min-height: 180px; resize: vertical; font-family: ui-monospace, monospace; font-size: 11px; }
    .author-panel .ap-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .author-panel .ap-row label { flex: 1 1 80px; }
    .graph-edges path.author-edge-selected {
      stroke: var(--accent); stroke-width: 2.5px;
    }
    .author-add-dialog {
      border: 1px solid var(--line); border-radius: 0;
      background: var(--panel); color: var(--text);
      padding: 0; max-width: 380px; width: calc(100% - 24px);
    }
    .author-add-dialog::backdrop { background: #00000066; }
    .author-add-dialog .aad-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; border-bottom: 1px solid var(--line);
    }
    .author-add-dialog .aad-body {
      padding: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .author-add-dialog label {
      display: flex; flex-direction: column; gap: 3px;
      font-size: 11px; color: var(--muted);
    }
    .author-add-dialog label[hidden] { display: none !important; }
    .author-add-dialog input, .author-add-dialog select {
      font: inherit; color: var(--text); background: var(--inset);
      border: 1px solid var(--line); border-radius: 0; padding: 5px 8px;
    }
    .author-add-dialog .aad-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; }

    .graph-node .gn-kind {
      font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--muted); margin: 0;
    }
    .graph-node.material .gn-kind { color: var(--wood); }
    .graph-node.machine .gn-kind { color: var(--machine-card); }
    .graph-node .gn-title {
      font-size: 12px; font-weight: 650; margin: 0; color: var(--text);
      line-height: 1.2;
    }
    .graph-node .gn-callout {
      font-size: 10px; color: var(--muted); line-height: 1.25;
      min-height: 2.4em;
    }
    /* Material nodes: Qty + Dims (+ optional muted angle/process) */
    .graph-node .gn-qty,
    .graph-node .gn-dims {
      font-size: 10px; color: var(--muted); line-height: 1.25;
      margin: 0;
    }
    .graph-node .gn-qty { color: var(--text); font-weight: 600; }
    .graph-node .gn-dims { color: var(--muted); }
    .graph-node .gn-note {
      font-size: 9px; color: var(--muted); line-height: 1.2;
      opacity: 0.82; margin: 0;
    }
    .graph-node .gn-thumb {
      width: 100%; aspect-ratio: 4 / 3; border-radius: 0;
      background: var(--preview-bg); border: 1px solid var(--preview-border);
      object-fit: cover; display: block;
    }

    .role-modal {
      border: 1px solid var(--line);
      border-radius: 0;
      padding: 0;
      background: var(--modal-bg);
      color: var(--text);
      width: min(1080px, calc(100vw - 32px));
      max-width: calc(100vw - 32px);
      height: min(680px, calc(100vh - 48px));
      max-height: calc(100vh - 48px);
    }
    .role-modal::backdrop { background: var(--backdrop); }
    .role-modal-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border-bottom: 1px solid var(--line);
      background: var(--modal-bar);
    }
    .role-modal-bar strong { flex: 1; font-size: 13px; }
    .role-modal-body {
      position: relative;
      height: calc(100% - 46px);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .role-modal-canvas-wrap {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 220px;
      height: 58%;
      position: relative;
      background: var(--modal-bg);
    }
    .role-modal-body:not(.has-setup) .role-modal-canvas-wrap {
      flex: 1 1 100%;
      height: 100%;
    }
    #roleModalCanvas { display: block; width: 100%; height: 100%; }
    .role-modal-setup {
      flex: 0 0 auto;
      width: 100%;
      max-width: none;
      max-height: 42%;
      overflow: auto;
      padding: 12px 14px;
      border-left: none;
      border-top: 1px solid var(--line);
      background: var(--inset);
      font-size: 12px;
      margin: 0;
      border-radius: 0;
      box-sizing: border-box;
    }
    .role-modal-setup[hidden],
    .role-modal-body:not(.has-setup) .role-modal-setup { display: none !important; }
    .role-modal-setup.materiallist .ms-title { color: var(--wood); }
    .role-modal-setup.materiallist { border-color: color-mix(in srgb, var(--wood) 40%, var(--line)); }
    .role-modal-edit {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .role-modal-edit[hidden] { display: none !important; }
    .role-modal-edit .rme-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .role-modal-edit textarea {
      width: 100%;
      min-height: 64px;
      resize: vertical;
      font: inherit;
      font-size: 12px;
      padding: 8px;
      border-radius: 0;
      border: 1px solid var(--line);
      background: var(--modal-bg);
      color: var(--text);
      box-sizing: border-box;
    }
    .role-modal-edit .rme-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .role-modal-edit .rme-row button {
      font: inherit;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 0;
      border: 1px solid var(--btn-border, var(--line));
      background: var(--btn-bg, var(--inset));
      color: var(--text);
      cursor: pointer;
    }
    .role-modal-edit .rme-row button:hover:not(:disabled) {
      border-color: var(--btn-hover-border, var(--hex));
    }
    .role-modal-edit .rme-row button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .role-modal-edit .rme-row button.primary {
      background: color-mix(in srgb, var(--hex) 28%, var(--inset));
      border-color: color-mix(in srgb, var(--hex) 55%, var(--line));
      font-weight: 600;
    }
    .role-modal-edit .rme-status {
      font-size: 11px;
      color: var(--muted);
      min-height: 1.2em;
    }
    .role-modal-edit .rme-status.is-error { color: #c62828; }
    .role-modal-edit .rme-status.is-ok { color: #2e7d32; }
    .role-modal-edit .rme-override-tip {
      font-size: 11px;
      color: var(--text);
      background: color-mix(in srgb, var(--hex) 12%, transparent);
      border: 1px dashed color-mix(in srgb, var(--hex) 40%, var(--line));
      border-radius: 0;
      padding: 6px 8px;
      margin-top: 4px;
    }

    /* Guide selector + Settings (left chrome unify) */
    .guide-select { margin: 0 0 8px; }
    .guide-select-label {
      font-size: 11px; font-weight: 650; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--muted); margin: 0 0 4px;
    }
    .guide-seg { display: flex; gap: 4px; flex-wrap: wrap; }
    .guide-seg a.guide-opt,
    .guide-seg button.guide-opt {
      flex: 1 1 0;
      min-width: 0;
      text-align: center;
      font-size: 11px;
      padding: 6px 8px;
      text-decoration: none;
      color: var(--text);
      background: var(--btn);
      border: 1px solid var(--line);
      border-radius: 0;
      cursor: pointer;
      font: inherit;
      line-height: 1.2;
    }
    .guide-seg a.guide-opt:hover,
    .guide-seg button.guide-opt:hover:not(:disabled) { border-color: var(--btn-hover-border); }
    .guide-seg .guide-opt.active {
      background: var(--btn-active);
      border-color: var(--hex);
    }
    .ui-settings-row { margin: 0 0 8px; }
    .ui-settings-row #btnSettings {
      width: 100%;
      font-size: 12px;
      text-align: left;
    }
    .settings-modal {
      border: 1px solid var(--line);
      border-radius: 0;
      padding: 0;
      background: var(--modal-bg);
      color: var(--text);
      width: min(360px, calc(100vw - 32px));
      max-width: calc(100vw - 32px);
    }
    .settings-modal::backdrop { background: var(--backdrop); }
    .settings-modal-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border-bottom: 1px solid var(--line);
      background: var(--modal-bar);
    }
    .settings-modal-bar strong { flex: 1; font-size: 13px; }
    .settings-modal-body { padding: 12px 14px; }
    .settings-group { margin: 0 0 14px; }
    .settings-group:last-child { margin-bottom: 0; }
    .settings-group-label {
      font-size: 11px; font-weight: 650; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--muted); margin: 0 0 6px;
    }
    .settings-group .row { margin: 0; }
    .settings-note {
      font-size: 11px; color: var(--muted); margin: 10px 0 0;
    }
  </style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="app">
    <aside class="ui" id="uiSidebar" aria-label="Shop controls">
      <div class="ui-head">
        <h1>Trillium 5/8 3v — Hex panel frames</h1>
        <button type="button" class="ui-collapse-btn" id="btnSidebarToggle" aria-controls="uiSidebar" aria-expanded="true" aria-label="Hide menu" title="Hide menu">
          <svg class="ui-menu-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/>
          </svg>
        </button>
      </div>
      <div class="guide-select" role="navigation" aria-label="Guide">
        <div class="guide-select-label">Guide</div>
        <div class="guide-seg">
          <a class="guide-opt" href="../assembly/">Assembly</a>
          <a class="guide-opt" href="../deck/">Deck</a>
          <button type="button" class="guide-opt active" id="guideHex" aria-current="page" title="Hex ×73 panel frames">Hex panel</button>
        </div>
      </div>
      <div class="ui-settings-row">
        <button type="button" id="btnSettings" title="Units and theme">Settings</button>
      </div>
      <h2>Steps</h2>
      <div class="row" id="steps"></div>
    </aside>
    <main class="graph-main" aria-label="Shop graph main view">
      <div class="graph-shell" id="graphShell" aria-label="Shop graph">
        <div class="graph-toolbar">
          <strong id="authorModeBadge" class="author-badge" hidden>Author</strong>
          <div id="authorToolbar" class="author-toolbar" hidden>

<script type="module">

import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
    import {
      HEX,
      STRUT_H,
      STOCK_W,
      STRUT_W,

      FULL_2X6_W_IN,
      RAW_STOCK_QTY,
      RAW_STOCK_LEN,
      RAW_STOCK_LEN_IN,

      BLANK_STOCK_LEFTOVER_IN,

      TOOL_TABLE_SAW,
      TOOL_MITER_SAW
    } from '../panel/panel-specs.js';

    // Locked dims live in panel/panel-specs.js (single source of truth).
    const BEVEL = BEVEL_RAD;

    /** Blanks per RAW_STOCK_LEN full 2×6 board (video cut-first). */
    const BLANKS_PER_BOARD = 3;

    const STEPS = [
      {
        id: 0,
        title: '1. Cut blanks',
        text: () => `Crosscut PDF 2×6 full stock to longest side ${fmt(BLANK_LEN)} (= HEX.a). Blade square — no bevel. Batch: ${RAW_STOCK_QTY} boards × ${BLANKS_PER_BOARD} = ${RAW_STOCK_QTY * BLANKS_PER_BOARD} blanks (panels need ${HEX.qty * 3}).`,
        view: 'blanks',
        machineVisual: 'miterCrosscut',
        machineSetup: {
          machines: () => `${TOOL_MITER_SAW} (prefer) · or hand saw`,
          settings: () => [
            `Crosscut PDF 2×6 (${fmt(STRUT_H)}×${fmt(FULL_2X6_W)}×${fmt(RAW_STOCK_LEN)}) to ${fmt(BLANK_LEN)} (= longest side)`,
            'Blade square: miter 0° / bevel 0° — no compound',
            'Use a stop block for repeat blank length',
            `Batch: ${RAW_STOCK_QTY} × ${BLANKS_PER_BOARD} blanks from stock`,
            blankStockLeftoverSetupLine()
          ]
        }
      },
      {
        id: 1,
        title: '2. Rip stock',
        text: () => `Rip the ${fmt(BLANK_LEN)} blanks in half on ${TOOL_TABLE_SAW}: ${fmt(STRUT_H)}×${fmt(FULL_2X6_W)} → ${fmt(STRUT_H)} × ${fmt(STOCK_W)}. Do not rip full 4 m first. Keep matched pairs.`,
        view: 'stock',
        machineVisual: 'tableRip',
        machineSetup: {
          machines: () => TOOL_TABLE_SAW,
          settings: () => [
            `Rip blanks in half (not full ${fmt(RAW_STOCK_LEN)} boards first)`,
            'Blade square: 90° / 0° bevel (no tilt)',
            `Fence: half of 2×6 → ${fmt(STRUT_H)} × ${fmt(STOCK_W)}`,
            'Use a push stick; keep matched pairs',
            ripSawdustTipLine()
          ]
        }
      },
      {
        id: 2,
        title: '3. Optional finish',
        text: () => `Optional: finish/stain flat faces on ripped halves before the bevel rip.`,
        view: 'stock',
        machineVisual: 'none',
        machineSetup: {
          machines: () => '',
          settings: () => []
        }
      },
      {
        id: 3,
        title: '4. Lay out hex jig',
        text: () => `${units === 'mm' ? '19 mm' : '¾"'} plywood > panel. Base marks ${fmt(HEX.c)} apart; arcs at ${fmt(HEX.a)}; apex = arc ∩. Connect the three points.`,

        }
      },
      {
        id: 4,
        title: '5. Rip 6.5° bevel',
        text: () => `Matched bevel-rip ${BEVEL_DEG}° on one long edge. Fence for finished face ${fmt(STRUT_W)} (PDF p7): ${fmt(STRUT_H)}×${fmt(STOCK_W)} → ${fmt(STRUT_H)}×${fmt(STRUT_W)}. Keep first strut as template; bevel faces out.`,
        view: 'bevel',
        machineVisual: 'tableBevel',
        machineSetup: {
          machines: () => TOOL_TABLE_SAW,
          settings: () => [
            `Bevel: set ${BEVEL_DEG}° on DWE7492 0–45° scale (0° = square)`,
            `Fence for finished face ${fmt(STRUT_W)}`,
            'Keep first strut as fence / template; matched pairs; bevel faces out',
            'Note: EU 90-based scales only → ~83.5°'
          ]
        }
      },
      {
        id: 5,
        title: '6. Finish jig stops',
        text: () => `Struts wide-face down on jig lines. Backing stops so each edge splits the layout line.`,
        view: 'jigStops',
        machineVisual: 'none',
        machineSetup: {
          machines: () => '',
          settings: () => []
        }
      },
      {
        id: 6,
        title: '7. Initial miters · base',
        text: () => `Simple miters (not compound). Cut base ends at ${HEX.base}° off 90°. Bevel 0°. Long-point to long-point. Batch: ${HEX.qty * 2} base ends (${HEX.qty} panels × 2). Check overlap on the jig.`,
        view: 'mitersBase',
        machineVisual: 'miterBase',
        machineSetup: {
          machines: () => TOOL_MITER_SAW,
          settings: () => [
            'Bevel 0° (simple miter, not compound)',
            `Dial miter ${HEX.base}° off 90°`,
            'Stop block; cut close to the end; long-point to long-point'

        }

      {
        id: 7,
        title: '8. Initial miters · apex',
        text: () => `Simple miters (not compound). Cut apex ends at ${HEX.apex}° off 90°. Bevel 0°. Dial ${HEX.apex}° — do not trust the ~31.6° stop alone. Batch: ${HEX.qty} apex ends. Check overlap on the jig.`,
        view: 'mitersApex',
        machineVisual: 'miterApex',
        machineSetup: {
          machines: () => TOOL_MITER_SAW,
          settings: () => [

            `Dial miter ${HEX.apex}° off 90°`,

      {
        id: 8,
        title: '9. Compound trim ears',
        text: () => `Compound ear trim: keep the lane miter (base ${HEX.base}° or apex ${HEX.apex}°) + ${BEVEL_DEG}° bevel. Dual bevel L/R — no flip. Stop block; check fit every 5–10 struts.`,
        view: 'ears',
        machineVisual: 'miterCompound',
        machineSetup: {
          machines: () => `${TOOL_MITER_SAW} (prefer) · hand saw only if needed`,
          settings: () => [
            `Keep lane miter + ${BEVEL_DEG}° bevel (compound)`,
            `Base lane: miter ${HEX.base}° · Apex lane: miter ${HEX.apex}°`,
            'Dual bevel L/R — no flip for opposite bevels',
            'Stop block; check fit every 5–10 struts'
          ]
        }
      },
      {
        id: 9,
        title: '10. Assemble',
        text: () => `Predrill if needed; two screws per corner; bevels out. QA: flip on jig — snug both ways.`,
        view: 'assemble',
        machineVisual: 'drill',
        machineSetup: {
          machines: () => 'Drill / driver (no saw)',
          settings: () => [
            'No saw angles for this step',
            'Predrill if needed; two screws per corner; bevels out'
          ]
        }
      },
      {
        id: 10,
        title: '11. Done / counts',
        text: () => `Panel complete — final Hex counts below.`,
        view: 'done',
        machineVisual: 'none',
        machineSetup: {
          machines: () => '',
          settings: () => []
        }
      }
    ];

    /**
     * Directed multigraph shop sequence derived from STEPS.
     * Shared material nodes + machine nodes (when machineVisual !== 'none').
     * Machine output feeds shared materials; later machines fan-in from those.
     */
    const NODE_W = 132;
    const NODE_H = 162;

    function halfDimsLabel() {
      // After cut-then-rip: short halves at blank length (= HEX.a)
      return units === 'mm'
        ? `${STRUT_H}×${STOCK_W}×${BLANK_LEN} mm`
        : `${STRUT_H_IN} × ${STOCK_W_IN} × ${BLANK_LEN_IN}`;
    }
    function blankFullDimsLabel() {
      // Pre-rip blank: full 2×6 section × blank length
      return units === 'mm'
        ? `${STRUT_H}×${FULL_2X6_W}×${BLANK_LEN} mm`
        : `${STRUT_H_IN} × ${FULL_2X6_W_IN} × ${BLANK_LEN_IN}`;
    }
    function stockDimsLabel() {
      return units === 'mm'
        ? `${STRUT_H}×${FULL_2X6_W}×${RAW_STOCK_LEN} mm`
        : `${STRUT_H_IN} × ${FULL_2X6_W_IN} × ${RAW_STOCK_LEN_IN}`;
    }
    function finishedDimsLabel() {
      return units === 'mm' ? `${STRUT_H}×${STRUT_W} mm` : `${STRUT_H_IN} × ${STRUT_W_IN}`;
    }

    /** Static topology + layout; callouts refreshed via nodeCallout(). */
    const GRAPH = {
      nodes: [
        // video order spine: cut → rip → bevel (~240px pitch, no overlap)
        { id: 'pdf-2x6', kind: 'material', title: 'PDF 2×6', materialKey: 'pdf-2x6', stepId: 0, x: 24, y: 40 },
        { id: 'm-miterCrosscut', kind: 'machine', title: 'Cut blanks', machineVisual: 'miterCrosscut', stepId: 0, x: 264, y: 40 },
        { id: 'blank', kind: 'material', title: 'Blank', materialKey: 'blank', stepId: 0, x: 504, y: 40 },
        { id: 'leftover', kind: 'material', title: 'Leftover stock', materialKey: 'leftover', stepId: 0, x: 504, y: -200 },

        { id: 'm-tableRip', kind: 'machine', title: 'Rip stock', machineVisual: 'tableRip', stepId: 1, x: 744, y: 40 },
        { id: 'ripped-half', kind: 'material', title: 'Ripped half', materialKey: 'ripped-half', stepId: 1, x: 984, y: 40 },

        // fan-out from ripped-half: optional finish + bevel
        { id: 'optional-finish', kind: 'material', title: 'Optional finish', materialKey: 'optional-finish', stepId: 2, x: 984, y: 280 },
        { id: 'm-tableBevel', kind: 'machine', title: 'Bevel rip', machineVisual: 'tableBevel', stepId: 4, x: 1224, y: 160 },
        { id: 'beveled', kind: 'material', title: 'Beveled', materialKey: 'beveled', stepId: 4, x: 1464, y: 160 },

        // fan-out: Initial miters · base vs apex lanes
        { id: 'm-miterBase', kind: 'machine', title: 'Initial miters · base', machineVisual: 'miterBase', stepId: 6, x: 1704, y: 40 },
        { id: 'm-miterApex', kind: 'machine', title: 'Initial miters · apex', machineVisual: 'miterApex', stepId: 7, x: 1704, y: 280 },
        { id: 'mitered-base', kind: 'material', title: 'Mitered base', materialKey: 'mitered-base', stepId: 6, x: 1944, y: 40 },
        { id: 'mitered-apex', kind: 'material', title: 'Mitered apex', materialKey: 'mitered-apex', stepId: 7, x: 1944, y: 280 },

        // fan-in: one compound ears from both mitered lanes
        { id: 'm-miterCompound', kind: 'machine', title: 'Compound ears', machineVisual: 'miterCompound', stepId: 8, x: 2184, y: 160 },
        { id: 'ears', kind: 'material', title: 'Ears', materialKey: 'ears', stepId: 8, x: 2424, y: 160 },

        // parallel jig lane
        { id: 'm-handLayout', kind: 'machine', title: 'Lay out jig', machineVisual: 'handLayout', stepId: 3, x: 744, y: 520 },
        { id: 'jig', kind: 'material', title: 'Jig', materialKey: 'jig', stepId: 3, x: 984, y: 520 },
        { id: 'jig-stops', kind: 'material', title: 'Jig + stops', materialKey: 'jig-stops', stepId: 5, x: 1224, y: 520 },

        // assemble fan-in
        { id: 'm-drill', kind: 'machine', title: 'Assemble', machineVisual: 'drill', stepId: 9, x: 2664, y: 240 },
        { id: 'assembled', kind: 'material', title: 'Assembled', materialKey: 'assembled', stepId: 9, x: 2904, y: 240 },
        { id: 'done', kind: 'material', title: 'Done', materialKey: 'done', stepId: 10, x: 3144, y: 240 }
      ],
      edges: [
        // cut-first: PDF → crosscut → blank + leftover
        { from: 'pdf-2x6', to: 'm-miterCrosscut' },
        { from: 'm-miterCrosscut', to: 'blank', fan: true },
        { from: 'm-miterCrosscut', to: 'leftover', fan: true },

        // then rip blanks in half
        { from: 'blank', to: 'm-tableRip' },
        { from: 'm-tableRip', to: 'ripped-half' },

        // fan-out: ripped-half → optional finish AND bevel
        { from: 'ripped-half', to: 'optional-finish', fan: true },
        { from: 'ripped-half', to: 'm-tableBevel', fan: true },
        { from: 'optional-finish', to: 'm-tableBevel' },
        { from: 'm-tableBevel', to: 'beveled' },

        // fan-out from beveled → base / apex Initial miters
        { from: 'beveled', to: 'm-miterBase', fan: true },
        { from: 'beveled', to: 'm-miterApex', fan: true },
        { from: 'm-miterBase', to: 'mitered-base' },
        { from: 'm-miterApex', to: 'mitered-apex' },

        // fan-in: both mitered lanes → one compound ears
        { from: 'mitered-base', to: 'm-miterCompound', fan: true },
        { from: 'mitered-apex', to: 'm-miterCompound', fan: true },
        { from: 'm-miterCompound', to: 'ears' },

        // jig lane
        { from: 'm-handLayout', to: 'jig' },
        { from: 'jig', to: 'jig-stops' },

        // fan-in: Assemble from ears + jig-stops
        { from: 'ears', to: 'm-drill', fan: true },
        { from: 'jig-stops', to: 'm-drill', fan: true },
        { from: 'm-drill', to: 'assembled' },
        { from: 'assembled', to: 'done' }
      ]
    };

    function nodeById(id) {
      return GRAPH.nodes.find((n) => n.id === id);
    }

    /** Deep clone of committed GRAPH — Reset authored restores from this. */
    const GRAPH_DEFAULT = JSON.parse(JSON.stringify(GRAPH));
    const AUTHOR_LS_KEY = 'hex-author-graph';

    let authorMode = false;
    let authorSelectedId = null;
    let authorSelectedEdgeIdx = null; // index into GRAPH.edges
    let authorEdgePick = null; // 'from' | 'to' while adding edge by click
    let authorNodeDrag = null;
    let authorSuppressClick = false;

    function materialKeyAllowlist() {
      const s = new Set();
      for (const n of GRAPH_DEFAULT.nodes) {
        if (n.kind === 'material' && n.materialKey) s.add(n.materialKey);
      }
      return [...s];
    }
    function machineVisualAllowlist() {
      const s = new Set();
      for (const n of GRAPH_DEFAULT.nodes) {
        if (n.kind === 'machine' && n.machineVisual) s.add(n.machineVisual);
      }
      return [...s];
    }

    function readAuthorFlag() {
      try {
        if (localStorage.getItem(AUTHOR_LS_KEY) === '1') return true;
      } catch (e) {}
      try {
        const q = new URLSearchParams(location.search);
        if (q.get('authorGraph') === '1') return true;
      } catch (e) {}
      return false;
    }

    function persistAuthorFlag(on) {
      try {
        if (on) localStorage.setItem(AUTHOR_LS_KEY, '1');
        else localStorage.removeItem(AUTHOR_LS_KEY);
      } catch (e) {}
    }

    function enterAuthorFromQueryIfNeeded() {
      try {
        const q = new URLSearchParams(location.search);
        if (q.get('authorGraph') === '1') persistAuthorFlag(true);
      } catch (e) {}
    }

    function setAuthorHint(msg) {
      const el = document.getElementById('authorHint');
      if (!el) return;
      if (msg) {
        el.hidden = false;
        el.textContent = msg;
      } else {
        el.hidden = true;
        el.textContent = '';
      }
    }

    function fillKeySelect(sel, keys, current) {
      if (!sel) return;
      sel.innerHTML = '';
      for (const k of keys) {
        const opt = document.createElement('option');
        opt.value = k;
        opt.textContent = k;
        if (k === current) opt.selected = true;
        sel.appendChild(opt);
      }
      if (current && !keys.includes(current)) {
        const opt = document.createElement('option');
        opt.value = current;
        opt.textContent = current + ' (custom)';
        opt.selected = true;
        sel.appendChild(opt);
      }
    }

    function fillNodeIdSelect(sel, current) {
      if (!sel) return;
      sel.innerHTML = '';
      for (const n of GRAPH.nodes) {
        const opt = document.createElement('option');
        opt.value = n.id;
        opt.textContent = `${n.id} — ${n.title}`;
        if (n.id === current) opt.selected = true;
        sel.appendChild(opt);
      }
    }

    function exportGraphJson() {
      const payload = {
        nodes: GRAPH.nodes.map((n) => {
          const o = { id: n.id, kind: n.kind, title: n.title, x: n.x, y: n.y };
          if (n.kind === 'material') o.materialKey = n.materialKey;
          if (n.kind === 'machine') o.machineVisual = n.machineVisual;
          if (typeof n.stepId === 'number') o.stepId = n.stepId;
          return o;
        }),
        edges: GRAPH.edges.map((e) => {
          const o = { from: e.from, to: e.to };
          if (e.fan) o.fan = true;
          return o;
        })
      };
      return JSON.stringify(payload, null, 2);
    }

    function syncAuthorChrome() {
      const shell = document.getElementById('graphShell');
      const badge = document.getElementById('authorModeBadge');
      const bar = document.getElementById('authorToolbar');
      if (shell) shell.classList.toggle('author-mode', authorMode);
      if (badge) badge.hidden = !authorMode;
      if (bar) bar.hidden = !authorMode;
      const addEdgeBtn = document.getElementById('authorAddEdge');
      if (addEdgeBtn) addEdgeBtn.classList.toggle('author-tool-active', !!authorEdgePick);
      if (!authorMode) {
        setAuthorHint('');
        authorEdgePick = null;
        const ep = document.getElementById('authorEditPanel');
        const xp = document.getElementById('authorExportPanel');
        const eg = document.getElementById('authorEdgePanel');
        if (ep) ep.hidden = true;
        if (xp) xp.hidden = true;
        if (eg) eg.hidden = true;
      }
      // selection outlines
      if (typeof graphNodesEl !== 'undefined' && graphNodesEl) {
        graphNodesEl.querySelectorAll('.graph-node').forEach((el) => {
          el.classList.toggle('author-selected', authorMode && el.dataset.nodeId === authorSelectedId);
        });
      }
      if (typeof graphEdgesSvg !== 'undefined' && graphEdgesSvg) {
        graphEdgesSvg.querySelectorAll('path[data-edge-idx]').forEach((p) => {
          const idx = Number(p.dataset.edgeIdx);
          p.classList.toggle('author-edge-selected', authorMode && authorSelectedEdgeIdx === idx);
        });
      }
    }

    function selectAuthorNode(id) {
      authorSelectedId = id || null;
      authorSelectedEdgeIdx = null;
      if (authorMode && id) showAuthorEditPanel(id);
      else {
        const ep = document.getElementById('authorEditPanel');
        if (ep) ep.hidden = true;
      }
      syncAuthorChrome();
    }

    function selectAuthorEdge(idx) {
      authorSelectedEdgeIdx = (typeof idx === 'number') ? idx : null;
      authorSelectedId = null;
      const ep = document.getElementById('authorEditPanel');
      if (ep) ep.hidden = true;
      if (authorMode && authorSelectedEdgeIdx != null) showAuthorEdgePanel(authorSelectedEdgeIdx);
      syncAuthorChrome();
    }

    function showAuthorEditPanel(id) {
      const n = nodeById(id);
      const panel = document.getElementById('authorEditPanel');
      if (!n || !panel) return;
      document.getElementById('authorExportPanel').hidden = true;
      document.getElementById('authorEdgePanel').hidden = true;
      panel.hidden = false;
      document.getElementById('authorEditTitle').value = n.title || '';
      document.getElementById('authorEditKind').value = n.kind;
      document.getElementById('authorEditX').value = String(Math.round(n.x));
      document.getElementById('authorEditY').value = String(Math.round(n.y));
      fillKeySelect(document.getElementById('authorEditMaterialKey'), materialKeyAllowlist(), n.materialKey);
      fillKeySelect(document.getElementById('authorEditMachineVisual'), machineVisualAllowlist(), n.machineVisual);
      const matWrap = document.getElementById('authorEditMatWrap');
      const machWrap = document.getElementById('authorEditMachWrap');
      matWrap.hidden = n.kind !== 'material';
      machWrap.hidden = n.kind !== 'machine';

    function showAuthorEdgePanel(idx) {
      const panel = document.getElementById('authorEdgePanel');
      if (!panel) return;
      document.getElementById('authorEditPanel').hidden = true;
      document.getElementById('authorExportPanel').hidden = true;
      panel.hidden = false;
      const e = (idx != null && idx >= 0) ? GRAPH.edges[idx] : null;
      fillNodeIdSelect(document.getElementById('authorEdgeFrom'), e ? e.from : (GRAPH.nodes[0] && GRAPH.nodes[0].id));
      fillNodeIdSelect(document.getElementById('authorEdgeTo'), e ? e.to : (GRAPH.nodes[1] && GRAPH.nodes[1].id));
      document.getElementById('authorEdgeFan').checked = !!(e && e.fan);
    }

    function applyAuthorEdit() {
      const n = nodeById(authorSelectedId);
      if (!n) return;
      const title = document.getElementById('authorEditTitle').value.trim() || n.title;
      const kind = document.getElementById('authorEditKind').value;
      const x = Number(document.getElementById('authorEditX').value);
      const y = Number(document.getElementById('authorEditY').value);
      const prevKind = n.kind;
      n.title = title;
      n.kind = kind === 'machine' ? 'machine' : 'material';
      if (Number.isFinite(x)) n.x = x;
      if (Number.isFinite(y)) n.y = y;
      if (n.kind === 'material') {
        n.materialKey = document.getElementById('authorEditMaterialKey').value || materialKeyAllowlist()[0];
        delete n.machineVisual;
      } else {
        n.machineVisual = document.getElementById('authorEditMachineVisual').value || machineVisualAllowlist()[0];
        delete n.materialKey;
      }
      if (prevKind !== n.kind || true) {
        rebuildGraphNodeLive(n.id);
        renderGraphDom();
        selectAuthorNode(n.id);
      }
    }

    function uniqueNodeId(base) {
      let id = base;
      let i = 2;
      while (nodeById(id)) {
        id = `${base}-${i++}`;
      }
      return id;
    }

    function addAuthorNode(opts) {
      const kind = opts.kind === 'machine' ? 'machine' : 'material';
      const keys = kind === 'material' ? materialKeyAllowlist() : machineVisualAllowlist();
      const key = opts.key || keys[0];
      const title = (opts.title && opts.title.trim()) || key || 'Node';
      const idBase = kind === 'machine' ? `m-${key}` : key;
      const id = uniqueNodeId(idBase);
      // place near viewport center in world coords
      const vw = graphViewport.clientWidth || 600;
      const vh = graphViewport.clientHeight || 400;
      const wx = (vw / 2 - graphPan.x) / graphPan.scale - NODE_W / 2;
      const wy = (vh / 2 - graphPan.y) / graphPan.scale - NODE_H / 2;
      const node = {
        id,
        kind,
        title,
        x: Math.round(wx / 24) * 24,
        y: Math.round(wy / 40) * 40
      };
      if (kind === 'material') node.materialKey = key;
      else node.machineVisual = key;
      GRAPH.nodes.push(node);
      buildGraphNodeRoot(node);
      renderGraphDom();
      selectAuthorNode(id);
      return node;
    }

    function deleteAuthorSelection() {
      if (authorSelectedEdgeIdx != null) {
        const e = GRAPH.edges[authorSelectedEdgeIdx];
        if (!e) return;
        if (!confirm(`Delete edge ${e.from} → ${e.to}?`)) return;
        GRAPH.edges.splice(authorSelectedEdgeIdx, 1);
        authorSelectedEdgeIdx = null;
        document.getElementById('authorEdgePanel').hidden = true;
        renderGraphDom();
        syncAuthorChrome();
        return;
      }
      if (!authorSelectedId) {
        alert('Select a node or edge first.');
        return;
      }
      const n = nodeById(authorSelectedId);
      if (!n) return;
      const edgeCount = GRAPH.edges.filter((e) => e.from === n.id || e.to === n.id).length;
      const msg = edgeCount
        ? `Delete node "${n.title}" and ${edgeCount} connected edge(s)?`
        : `Delete node "${n.title}"?`;
      if (!confirm(msg)) return;
      // remove 3D state
      const prev = graphNodeState.get(n.id);
      if (prev) {
        clearCss2dIn(prev.root);
        if (prev.root.parent) prev.root.parent.remove(prev.root);
        graphNodeState.delete(n.id);
      }
      if (graphModalNodeId === n.id) closeRoleModal(true);
      GRAPH.edges = GRAPH.edges.filter((e) => e.from !== n.id && e.to !== n.id);
      const ni = GRAPH.nodes.findIndex((x) => x.id === n.id);
      if (ni >= 0) GRAPH.nodes.splice(ni, 1);
      authorSelectedId = null;
      document.getElementById('authorEditPanel').hidden = true;
      renderGraphDom();
      syncAuthorChrome();
    }

    function resetAuthoredGraph() {
      if (!confirm('Reset graph to committed defaults? Unsaved author edits will be lost.')) return;
      const fresh = JSON.parse(JSON.stringify(GRAPH_DEFAULT));
      if (graphModalNodeId) closeRoleModal(true);
      clearGraphNodeState();
      GRAPH.nodes.length = 0;
      GRAPH.edges.length = 0;
      GRAPH.nodes.push(...fresh.nodes);
      GRAPH.edges.push(...fresh.edges);
      authorSelectedId = null;
      authorSelectedEdgeIdx = null;
      for (const n of GRAPH.nodes) buildGraphNodeRoot(n);
      renderGraphDom();
      document.getElementById('authorEditPanel').hidden = true;
      document.getElementById('authorEdgePanel').hidden = true;
      syncAuthorChrome();
      try { fitGraphView(); } catch (e) {}
    }

    function setAuthorMode(on) {
      authorMode = !!on;
      if (!authorMode) {
        authorSelectedId = null;
        authorSelectedEdgeIdx = null;
        authorEdgePick = null;
        authorNodeDrag = null;
        persistAuthorFlag(false);
        // strip query flag on exit so refresh stays out
        try {
          const url = new URL(location.href);
          if (url.searchParams.has('authorGraph')) {
            url.searchParams.delete('authorGraph');
            history.replaceState(null, '', url.pathname + url.search + url.hash);
          }
        } catch (e) {}
      } else {
        persistAuthorFlag(true);
      }
      syncAuthorChrome();
      renderGraphDom();
    }

    function beginAddEdgeMode() {
      if (!authorMode) return;
      authorEdgePick = 'from';
      authorSelectedEdgeIdx = null;
      setAuthorHint('Click source node, then target');
      document.getElementById('authorAddEdge').classList.add('author-tool-active');
      showAuthorEdgePanel(null);
      syncAuthorChrome();
    }

    function cancelAddEdgeMode() {
      authorEdgePick = null;
      setAuthorHint('');
      const btn = document.getElementById('authorAddEdge');
      if (btn) btn.classList.remove('author-tool-active');
    }

    function onAuthorNodeClick(n, ev) {
      if (!authorMode) return false;
      if (authorSuppressClick) {
        authorSuppressClick = false;
        return true;
      }
      if (authorEdgePick === 'from') {
        document.getElementById('authorEdgeFrom').value = n.id;
        authorEdgePick = 'to';
        setAuthorHint(`From ${n.id} — click target`);
        selectAuthorNode(n.id);
        return true;
      }
      if (authorEdgePick === 'to') {
        document.getElementById('authorEdgeTo').value = n.id;
        // auto-add edge
        const from = document.getElementById('authorEdgeFrom').value;
        const to = n.id;
        if (from && to && from !== to) {
          const fan = document.getElementById('authorEdgeFan').checked;
          const exists = GRAPH.edges.findIndex((e) => e.from === from && e.to === to);
          if (exists < 0) {
            const edge = { from, to };
            if (fan) edge.fan = true;
            GRAPH.edges.push(edge);
            authorSelectedEdgeIdx = GRAPH.edges.length - 1;
          } else {
            authorSelectedEdgeIdx = exists;
          }
          cancelAddEdgeMode();
          renderGraphDom();
          showAuthorEdgePanel(authorSelectedEdgeIdx);
          syncAuthorChrome();
        } else {
          setAuthorHint('Pick a different target');
        }
        return true;
      }
      // normal select
      selectAuthorNode(n.id);
      return true;
    }


    /**
     * Material graph callout parts — qty + outer dims from panel-specs only.
     * Optional muted note for angle/process (mitered, ears, bevel). No invented scrap dims.
     * @returns {{ qty: string, dims: string, note: string }}
     */
    function materialCalloutParts(k) {
      if (k === 'pdf-2x6') {
        return { qty: `(${RAW_STOCK_QTY})`, dims: stockDimsLabel(), note: '' };
      }
      if (k === 'ripped-half') {
        // 96 blanks × 2 halves = 192 (PDF-honest stock yield)
        return { qty: String(RAW_STOCK_QTY * BLANKS_PER_BOARD * 2), dims: halfDimsLabel(), note: 'short halves' };
      }
      if (k === 'optional-finish') {
        return { qty: 'matched pair', dims: halfDimsLabel(), note: '' };
      }
      if (k === 'blank') {
        // Pre-rip full 2×6 × BLANK_LEN; stock-derived 32×3=96
        return {
          qty: String(RAW_STOCK_QTY * BLANKS_PER_BOARD),
          dims: blankWhlLabel(),
          note: `panels need ${HEX.qty * 3}`
        };
      }
      if (k === 'leftover') {
        // One remnant per full 2×6 board after 3 blank cuts (kerf math in panel-specs)
        return {
          qty: String(RAW_STOCK_QTY),
          dims: leftoverWhlLabel(),
          note: leftoverSawdustNote()
        };
      }
      if (k === 'beveled') {
        // Finished face locked in panel-specs; same blank count; bevel as note
        return { qty: String(HEX.qty * 3), dims: finishedDimsLabel(), note: `${BEVEL_DEG}° bevel` };
      }
      if (k === 'jig') {
        // Geometry marks only — no stock qty
        return { qty: '', dims: `base ${fmt(HEX.c)} · arcs ${fmt(HEX.a)}`, note: '' };
      }
      if (k === 'jig-stops') {
        return { qty: '', dims: '', note: 'jig + backing stops' };
      }
      if (k === 'mitered-base') {
        return {
          qty: String(HEX.qty * 2),
          dims: finishedDimsLabel(),
          note: `${HEX.base}° base`
        };
      }
      if (k === 'mitered-apex') {
        return {
          qty: String(HEX.qty),
          dims: finishedDimsLabel(),
          note: `${HEX.apex}° apex`
        };
      }
      if (k === 'ears') {
        return {
          qty: String(HEX.qty * 3),
          dims: finishedDimsLabel(),
          note: `compound ears + ${BEVEL_DEG}°`
        };
      }
      if (k === 'assembled') {
        // One frame shown; outer sides locked on HEX — no scrap dims
        return {
          qty: '1',
          dims: `${fmt(HEX.a)} / ${fmt(HEX.b)} / ${fmt(HEX.c)}`,
          note: 'assembled frame'
        };
      }
      if (k === 'done') {
        return {
          qty: `${HEX.qty} hex panels`,
          dims: `${fmt(HEX.a)} / ${fmt(HEX.b)} / ${fmt(HEX.c)}`,
          note: ''
        };
      }
      return { qty: '', dims: '', note: '' };
    }

    function formatMaterialCallout(parts) {
      const bits = [];
      if (parts.qty) bits.push(parts.qty);
      if (parts.dims) bits.push(parts.dims);
      if (parts.note) bits.push(parts.note);
      return bits.join(' · ');
    }

    function nodeCallout(n) {
      if (n.kind === 'machine') {
        const mv = n.machineVisual;
        if (mv === 'tableRip') return `${TOOL_TABLE_SAW} · rip`;
        if (mv === 'tableBevel') return `${TOOL_TABLE_SAW} · ${BEVEL_DEG}°`;
        if (mv === 'miterCrosscut') return `${TOOL_MITER_SAW} · crosscut`;
        if (mv === 'miterBase') return `${TOOL_MITER_SAW} · base ${HEX.base}°`;
        if (mv === 'miterApex') return `${TOOL_MITER_SAW} · apex ${HEX.apex}°`;
        if (mv === 'miterSimple') return `${TOOL_MITER_SAW} · miters`;
        if (mv === 'miterCompound') return `${TOOL_MITER_SAW} · compound`;
        if (mv === 'handLayout') return 'hand layout · no saw';
        if (mv === 'drill') return 'drill / driver';
        return 'machine';
      }
      return formatMaterialCallout(materialCalloutParts(n.materialKey));
    }

    const _qs = new URLSearchParams(location.search);
    let step = Math.max(0, Math.min(STEPS.length - 1, parseInt(_qs.get('step') || '0', 10) || 0));
    const UNITS_KEY = 'hex-units';
    const THEME_KEY = 'hex-theme';
    const SIDEBAR_KEY = 'hex-sidebar-collapsed';
    const OVERRIDE_STORAGE_KEY = 'hex-3d-overrides-v1';
    const OVERRIDE_MOCK_KEY = 'hex-3d-edit-mock';
    const OVERRIDE_SCHEMA_VERSION = 1;
    const OVERRIDE_ALLOW = new Set([
      'schemaVersion', 'note', 'qtyLabel', 'dimsLabel', 'labelTexts',
      'stackCount', 'stackRows', 'scale', 'miterDeg', 'bevelDeg', 'highlightColor'
    ]);

    /** @type {Map<string, { history: object[], current: object|null }>} */
    const overrideStore = new Map();

    function overrideKey(nodeId, kind) {
      return `${nodeId}:${kind}`;
    }

    function clampNum(n, lo, hi, fallback) {
      const v = Number(n);
      if (!Number.isFinite(v)) return fallback;
      return Math.min(hi, Math.max(lo, v));
    }

    function clampStr(s, maxLen) {
      if (typeof s !== 'string') return undefined;
      const t = s.trim();
      if (!t) return undefined;
      return t.slice(0, maxLen);
    }

    /** Validate allowlist; drop unknown keys; clamp; reject non-objects. */
    function validateOverride(raw) {
      if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
      const out = { schemaVersion: OVERRIDE_SCHEMA_VERSION };
      for (const k of Object.keys(raw)) {
        if (!OVERRIDE_ALLOW.has(k)) continue;
        const v = raw[k];
        if (k === 'schemaVersion') {
          out.schemaVersion = OVERRIDE_SCHEMA_VERSION;
        } else if (k === 'note' || k === 'qtyLabel' || k === 'dimsLabel') {
          const s = clampStr(v, 120);
          if (s !== undefined) out[k] = s;
        } else if (k === 'labelTexts') {
          if (Array.isArray(v)) {
            const arr = v.map((x) => clampStr(x, 80)).filter(Boolean).slice(0, 8);
            if (arr.length) out.labelTexts = arr;
          }
        } else if (k === 'stackCount') {
          out.stackCount = clampNum(v, 1, 64, undefined);
          if (out.stackCount === undefined) delete out.stackCount;
        } else if (k === 'stackRows') {
          out.stackRows = clampNum(v, 1, 16, undefined);
          if (out.stackRows === undefined) delete out.stackRows;
        } else if (k === 'scale') {
          out.scale = clampNum(v, 0.4, 2.5, undefined);
          if (out.scale === undefined) delete out.scale;
        } else if (k === 'miterDeg') {
          out.miterDeg = clampNum(v, 0, 60, undefined);
          if (out.miterDeg === undefined) delete out.miterDeg;
        } else if (k === 'bevelDeg') {
          out.bevelDeg = clampNum(v, 0, 45, undefined);
          if (out.bevelDeg === undefined) delete out.bevelDeg;
        } else if (k === 'highlightColor') {
          if (typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v.trim())) {
            out.highlightColor = v.trim().toLowerCase();
          }
        }
      }
      const keys = Object.keys(out).filter((k) => k !== 'schemaVersion');
      if (!keys.length) return null;
      return out;
    }

    function loadOverridesFromStorage() {
      overrideStore.clear();
      try {
        const raw = localStorage.getItem(OVERRIDE_STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') return;
        for (const [key, entry] of Object.entries(parsed)) {
          if (!entry || typeof entry !== 'object') continue;
          const history = Array.isArray(entry.history)
            ? entry.history.map(validateOverride).filter(Boolean)
            : [];
          const current = entry.current ? validateOverride(entry.current) : null;
          if (current || history.length) {
            overrideStore.set(key, { history, current });
          }
        }
      } catch (e) {}
    }

    function persistOverrides() {
      const obj = {};
      for (const [key, entry] of overrideStore.entries()) {
        obj[key] = {
          history: entry.history || [],
          current: entry.current || null
        };
      }
      try {
        localStorage.setItem(OVERRIDE_STORAGE_KEY, JSON.stringify(obj));
      } catch (e) {}
    }

    function getOverrideEntry(key) {
      return overrideStore.get(key) || null;
    }

    function getCurrentOverride(nodeId, kind) {
      const e = getOverrideEntry(overrideKey(nodeId, kind));
      return e && e.current ? e.current : null;
    }

    function setOverrideCurrent(key, next) {
      let e = overrideStore.get(key);
      if (!e) {
        e = { history: [], current: null };
        overrideStore.set(key, e);
      }
      // Always push previous current (null = authored) so Undo restores prior step
      e.history.push(e.current);
      e.current = next;
      persistOverrides();
    }

    function undoOverride(key) {
      const e = overrideStore.get(key);
      if (!e || !e.history.length) return false;
      e.current = e.history.pop(); // may be null (= authored)
      if (e.current == null && !e.history.length) overrideStore.delete(key);
      persistOverrides();
      return true;
    }

    function resetOverride(key) {
      if (!overrideStore.has(key)) return false;
      overrideStore.delete(key);
      persistOverrides();
      return true;
    }

    function useMockEdit() {
      if (_qs.get('mockEdit') === '1') return true;
      try {
        if (localStorage.getItem(OVERRIDE_MOCK_KEY) === '1') return true;
      } catch (e) {}
      return false;
    }

    /** Deterministic keyword mock for QA without Worker. */
    function mockOverrideFromPrompt(prompt, context) {
      const p = String(prompt || '').toLowerCase();
      const out = { schemaVersion: OVERRIDE_SCHEMA_VERSION };
      if (/\btaller\b|\bbigger\b|\blarger\b/.test(p)) out.scale = 1.35;
      if (/\bshorter\b|\bsmaller\b/.test(p)) out.scale = 0.75;
      const noteM = p.match(/\bnote:\s*(.+?)(?:\s*[·|]|$)/i) || p.match(/\bnote\s+(.+?)(?:\s*[·|]|$)/i);
      if (noteM) out.note = noteM[1].trim().slice(0, 120);
      const qtyM = p.match(/\bqty\s*[:=]?\s*(\d+)\b/i);
      if (qtyM) out.qtyLabel = String(qtyM[1]);
      const dimsM = p.match(/\bdims?:\s*(.+?)(?:\s*[·|]|$)/i);
      if (dimsM) out.dimsLabel = dimsM[1].trim().slice(0, 120);
      if (/\bred\b/.test(p)) out.highlightColor = '#c62828';
      if (/\bblue\b/.test(p)) out.highlightColor = '#1565c0';
      if (/\bgreen\b/.test(p)) out.highlightColor = '#2e7d32';
      if (/\byellow\b/.test(p)) out.highlightColor = '#f5c518';
      const miterM = p.match(/\bmiters?\s*[:=]?\s*(\d+(?:\.\d+)?)\b/i);
      if (miterM) out.miterDeg = Number(miterM[1]);
      const bevelM = p.match(/\bbevels?\s*[:=]?\s*(\d+(?:\.\d+)?)\b/i);
      if (bevelM) out.bevelDeg = Number(bevelM[1]);
      const labels = [];
      const labelM = p.match(/\blabel:\s*(.+?)(?:\s*[·|]|$)/i);
      if (labelM) labels.push(labelM[1].trim());
      if (labels.length) out.labelTexts = labels;
      if (context && context.kind === 'machine' && out.miterDeg == null && /\bcrosscut\b/.test(p)) {
        out.miterDeg = 0;
      }
      return validateOverride(out);
    }

    async function readHexEditError(res) {
      const statusBit = `Edit API error ${res.status}`;
      try {
        const data = await res.json();
        if (data && typeof data.error === 'string' && data.error.trim()) {
          return data.error.trim();
        }
        if (data && data.ok === false) {
          return statusBit;
        }
      } catch (e) {
        try {
          const text = await res.clone().text();
          if (text && text.trim()) {
            const t = text.trim().slice(0, 240);
            return `${statusBit}: ${t}`;
          }
        } catch (e2) {}
      }
      return statusBit;
    }

    async function fetchHexEditOnce(prompt, context) {
      return fetch('/api/hex-edit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt, context, schemaVersion: OVERRIDE_SCHEMA_VERSION })
      });
    }

    async function requestHexEdit(prompt, context) {
      if (useMockEdit()) {
        const override = mockOverrideFromPrompt(prompt, context);
        if (!override) return { ok: false, error: 'Mock found no keywords. Try: taller, note: …, qty 10, red, miter 30' };
        return { ok: true, override, mock: true };
      }
      let lastNetworkError = null;
      for (let attempt = 0; attempt < 2; attempt++) {
        try {
          const res = await fetchHexEditOnce(prompt, context);
          if (res.status === 404) {
            const override = mockOverrideFromPrompt(prompt, context);
            if (!override) return { ok: false, error: 'Edit API missing (404). Enable mock with ?mockEdit=1' };
            return { ok: true, override, mock: true };
          }
          // One automatic retry on 502 / 503 / 504
          if ((res.status === 502 || res.status === 503 || res.status === 504) && attempt === 0) {
            continue;
          }
          if (!res.ok) {
            const error = await readHexEditError(res);
            return { ok: false, error };
          }
          const data = await res.json();
          if (!data || !data.ok) {
            return { ok: false, error: (data && data.error) || 'Edit failed' };
          }
          const override = validateOverride(data.override);
          if (!override) {
            return { ok: false, error: (data && data.error) || 'Override failed allowlist validation' };
          }
          return { ok: true, override };
        } catch (err) {
          lastNetworkError = err;
          // One automatic retry on network failure
          if (attempt === 0) continue;
        }
      }
      return {
        ok: false,
        error: lastNetworkError
          ? `Network error${lastNetworkError.message ? ': ' + String(lastNetworkError.message).slice(0, 160) : ''} — enable ?mockEdit=1 for offline QA`
          : 'Network error — enable ?mockEdit=1 for offline QA'

    function fmt(mm) {
      if (units === 'mm') return `${mm} mm`;
      if (PLAN_IN.has(mm)) return PLAN_IN.get(mm);
      const inches = mm / 25.4;
      const ft = Math.floor(inches / 12 + 1e-9);
      let inch = inches - ft * 12;
      const sixteenths = Math.round(inch * 16) / 16;
      const whole = Math.floor(sixteenths + 1e-9);
      let num = Math.round((sixteenths - whole) * 16);
      let den = 16;
      if (num === 16) { num = 0; }
      // Avoid invalid feet-inches like 3'-12"
      if (whole === 12) return `${ft + 1}'-0"`;
      const g = num ? gcd(num, den) : 1;
      const fracStr = num ? ` ${num / g}/${den / g}` : '';
      if (ft) return `${ft}'-${whole}${fracStr}"`;
      return `${whole}${fracStr}"`;
    }

      const s = (a + b + c) / 2;

    }

    function strutMesh(lengthMm, faceWmm = STRUT_W, mat = woodMat) {
      const L = lengthMm / 1000;
      const h = STRUT_H / 1000;
      const w = faceWmm / 1000;
      const taper = Math.tan(BEVEL) * h;
      const shape = new THREE.Shape();
      shape.moveTo(0, 0);
      shape.lineTo(w, 0);
      shape.lineTo(Math.max(0.001, w - taper), h);
      shape.lineTo(0, h);
      shape.closePath();
      const geo = new THREE.ExtrudeGeometry(shape, { depth: L, bevelEnabled: false });
      geo.translate(-w / 2, 0, -L / 2);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function placeStrut(p1, p2, up, faceWmm = STRUT_W) {
      const a = p1.clone();
      const b = p2.clone();
      const dir = new THREE.Vector3().subVectors(b, a);
      const len = dir.length();
      const mid = a.clone().add(b).multiplyScalar(0.5);
      const mesh = strutMesh(len * 1000, faceWmm);
      mesh.position.copy(mid);
      const z = dir.clone().normalize();
      const x = new THREE.Vector3().crossVectors(up, z).normalize();
      const y = new THREE.Vector3().crossVectors(z, x).normalize();
      mesh.setRotationFromMatrix(new THREE.Matrix4().makeBasis(x, y, z));
      mesh.position.add(y.clone().multiplyScalar(STRUT_H / 2000));
      return mesh;
    }

    function hexPoints() {

      const pA = new THREE.Vector3(-c / 2, 0, 0);
      const pB = new THREE.Vector3(c / 2, 0, 0);
      const xApex = (a * a - b * b + c * c) / (2 * c);
      const pC = new THREE.Vector3(-c / 2 + xApex, 0, h);
      return { pA, pB, pC, h, c };
    }

    /** MAKITA LS1019L — teal head, twin rails, clear guard, silver turntable, teal kerf */
    function addMiterSawSchematic({ miterDeg = 0, bevelDeg = 0, bevelSide = 'L', stop = true, label, compound = false }) {
      const g = new THREE.Group();
      const miterRad = (miterDeg * Math.PI) / 180;
      const bevelRad = (bevelDeg * Math.PI) / 180;
      const kerfMat = new THREE.MeshStandardMaterial({ color: 0x1a8f8a, roughness: 0.45 });
      const guardMat = new THREE.MeshStandardMaterial({ color: 0x009b93, roughness: 0.35, transparent: true, opacity: 0.45 });

      const base = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.06, 0.55), makitaSilver);
      base.position.set(0, 0, 0.02); g.add(base);
      const turntable = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.38, 0.045, 32), makitaSilver);
      turntable.position.y = 0.05; g.add(turntable);
      const miterScale = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.008, 0.04), makitaSilver);
      miterScale.position.set(0.12, 0.075, 0.34); g.add(miterScale);
      const stop316 = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.012, 0.012), new THREE.MeshStandardMaterial({ color: 0xc62828 }));
      stop316.position.set(0.12 - 0.275 + (31.6 / 45) * 0.55, 0.085, 0.34); g.add(stop316);
      const mKnob = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.04, 0.06, 12), makitaDark);
      mKnob.rotation.x = Math.PI / 2; mKnob.position.set(0, 0.04, 0.42); g.add(mKnob);

      [-0.028, 0.028].forEach((x) => {
        const kp = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.01, 0.28), kerfMat);
        kp.position.set(x, 0.075, 0.04); g.add(kp);
      });
      const fenceL = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.2, 0.032), makitaSilver);
      fenceL.position.set(-0.24, 0.18, -0.14);
      const fenceR = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.2, 0.032), makitaSilver);
      fenceR.position.set(0.24, 0.18, -0.14);
      g.add(fenceL, fenceR);

      const arm = new THREE.Group();
      arm.rotation.y = -miterRad;
      [0.30, 0.40].forEach((y) => {
        const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.78, 12), makitaSilver);
        rail.rotation.x = Math.PI / 2; rail.position.set(-0.14, y, -0.05); arm.add(rail);
      });
      const motor = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.2, 0.28), makitaTeal);
      motor.position.set(0.02, 0.42, 0.22); arm.add(motor);
      const handle = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.018, 6, 16, Math.PI * 1.2), makitaTeal);
      handle.rotation.z = Math.PI / 2; handle.position.set(0.02, 0.56, 0.22); arm.add(handle);

      const bladeG = new THREE.Group();
      const blade = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.0035, 32), bladeMat);
      blade.rotation.z = Math.PI / 2; bladeG.add(blade);
      const guard = new THREE.Mesh(new THREE.CylinderGeometry(0.145, 0.145, 0.05, 20, 1, false, -0.2, Math.PI * 1.35), guardMat);
      guard.rotation.z = Math.PI / 2; guard.position.set(0.01, 0.02, 0); bladeG.add(guard);
      bladeG.rotation.z = bevelSide === 'R' ? bevelRad : -bevelRad;
      bladeG.position.set(0, 0.26, 0.08); arm.add(bladeG);
      g.add(arm);

      const blank = new THREE.Mesh(new THREE.BoxGeometry(0.55, STRUT_H / 1000, STOCK_W / 1000), woodMat);
      blank.position.set(0.05, 0.078 + STRUT_H / 2000, -0.02); g.add(blank);
      if (stop) {
        const sb = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.1, 0.07), stopMat);
        sb.position.set(-0.36, 0.12, -0.02); g.add(sb);
      }

      const hud = [];
      if (miterDeg === 0) hud.push('Miter 0° (crosscut)');
      else hud.push('Dial miter to ' + miterDeg + '° — not the 31.6° stop');
      hud.push(bevelDeg === 0 ? 'Bevel 0° (simple)' : 'Bevel ' + bevelDeg + '° ' + bevelSide);
      if (compound) hud.push('Dual bevel L/R — no flip');
      if (stop) hud.push('Stop block (orange)');
      if (label) hud.push(label);
      hud.push('Teal kerf · silver turntable · work on fence');
      setMachineHud('makita', 'MAKITA LS1019L', hud);
      g.scale.setScalar(1.1); machineTarget.add(g); return g;
    }

    function clearCss2dIn(obj) {

    function fitIsoCamera(cam, root, aspect) {
      const box = new THREE.Box3().setFromObject(root);
      if (box.isEmpty()) {
        cam.position.set(1.2, 1.0, 1.4);
        cam.lookAt(0, 0.2, 0);
        return;
      }
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z, 0.2);
      const dist = maxDim * 2.15;
      cam.aspect = aspect;
      cam.near = 0.01;
      cam.far = Math.max(50, dist * 8);
      // isometric-ish
      cam.position.set(center.x + dist * 0.85, center.y + dist * 0.65, center.z + dist * 0.95);
      cam.lookAt(center);
      cam.updateProjectionMatrix();
    }

    function captureRolePreview(root) {
      if (!root || root.children.length === 0) return '';
      // Temporarily park any CSS2D — WebGL preview won't draw them; callouts cover dims.
      previewScene.add(root);
      fitIsoCamera(previewCam, root, 320 / 240);
      previewRenderer.render(previewScene, previewCam);
      let url = '';
      try { url = previewRenderer.domElement.toDataURL('image/png'); } catch (e) { url = ''; }
      previewScene.remove(root);
      roleHold.add(root);
      return url;
    }

    function buildRipMaterials() {
      // PDF 2×6 stack only (input) — proportions from 950ad3b / d5fec81
      addMaterialsPad(1.2, 1.0);
      const stockQty = `(${RAW_STOCK_QTY})`;
      const stockDims = units === 'mm'
        ? `${STRUT_H}×${FULL_2X6_W}×${RAW_STOCK_LEN} mm`
        : `${STRUT_H_IN} × ${FULL_2X6_W_IN} × ${RAW_STOCK_LEN_IN}`;
      const n = RAW_STOCK_QTY;
      const stackBudgetH = 0.94;
      const gapRatio = 1.15;
      const faceH = stackBudgetH / (n + gapRatio * (n - 1));
      const gap = faceH * gapRatio;
      const faceW = faceH * (FULL_2X6_W / STRUT_H);
      const faceL = Math.min(faceW * (RAW_STOCK_LEN / FULL_2X6_W), 0.70);
      const yaw = 0.35;
      const stackX = 0;
      const stackBaseY = 0.01;
      const stackTopY = stackBaseY + n * faceH + (n - 1) * gap;
      const stackMat = woodMat.clone();
      stackMat.emissive = new THREE.Color(0x2a1808);
      stackMat.emissiveIntensity = 0.22;
      for (let i = 0; i < n; i++) {
        const board = new THREE.Mesh(new THREE.BoxGeometry(faceW, faceH, faceL), stackMat);
        board.frustumCulled = false;
        board.rotation.y = yaw;
        board.position.set(stackX, stackBaseY + faceH / 2 + i * (faceH + gap), 0);
        woodTarget.add(board);
        addDarkOutline(board);
      }
      woodTarget.add(makeLabel('PDF 2×6 kiln-dried', new THREE.Vector3(stackX, stackTopY + 0.09, 0)));
      woodTarget.add(makeLabel(`${stockQty}  ${stockDims}`, new THREE.Vector3(stackX, stackBaseY - 0.08, 0)));
      return { callout: `${stockQty}  ${stockDims}`, faceH, gap, faceL, yaw, stackMat, stackBaseY, stackTopY };
    }

    function buildRipOutput(shared) {
      // Two half stacks (RAW_STOCK_QTY × 2)
      addMaterialsPad(1.35, 1.0);
      const n = RAW_STOCK_QTY;
      const faceH = shared.faceH;
      const gap = shared.gap;
      const faceL = shared.faceL;
      const yaw = shared.yaw;
      const stackMat = shared.stackMat;
      const stackBaseY = shared.stackBaseY;
      const stackTopY = shared.stackTopY;
      const halfLabel = halfDimsLabel();
      const halfFaceW = faceH * (STOCK_W / STRUT_H);
      const halfFaceH = faceH;
      const halfFaceL = faceL;
      const halfStackGap = Math.max(halfFaceW * 1.15, 0.08);
      const halfX0 = - (halfFaceW + halfStackGap) / 2;
      const halfX1 = (halfFaceW + halfStackGap) / 2;
      const halvesMidX = 0;
      for (const hx of [halfX0, halfX1]) {
        for (let i = 0; i < n; i++) {
          const half = new THREE.Mesh(new THREE.BoxGeometry(halfFaceW, halfFaceH, halfFaceL), stackMat);
          half.frustumCulled = false;
          half.rotation.y = yaw;
          half.position.set(hx, stackBaseY + halfFaceH / 2 + i * (halfFaceH + gap), 0);
          woodTarget.add(half);
          addDarkOutline(half);
        }
      }
      woodTarget.add(makeLabel(halfLabel, new THREE.Vector3(halvesMidX, stackTopY + 0.09, 0)));
      woodTarget.add(makeLabel(`${n} × 2  ·  ${n * 2} halves`, new THREE.Vector3(halvesMidX, stackBaseY - 0.08, 0)));
      return `${n} × 2  ·  ${halfLabel}`;
    }

    /** Build shared material geometry into woodTarget for a GRAPH materialKey. */
    function buildMaterialKey(key) {
      const { pA, pB, pC, h, c } = hexPoints();
      const up = new THREE.Vector3(0, 1, 0);
      if (key === 'pdf-2x6') {
        const shared = buildRipMaterials();
        return shared.callout;
      }
      if (key === 'ripped-half') {
        // Same stack metrics as rip materials, but only draw the two half stacks.
        const n = RAW_STOCK_QTY;
        const stackBudgetH = 0.94;
        const gapRatio = 1.15;
        const faceH = stackBudgetH / (n + gapRatio * (n - 1));
        const gap = faceH * gapRatio;
        const faceW = faceH * (FULL_2X6_W / STRUT_H);
        const faceL = Math.min(faceW * (RAW_STOCK_LEN / FULL_2X6_W), 0.70);
        const yaw = 0.35;
        const stackMat = woodMat.clone();
        stackMat.emissive = new THREE.Color(0x2a1808);
        stackMat.emissiveIntensity = 0.22;
        const stackBaseY = 0.01;
        const stackTopY = stackBaseY + n * faceH + (n - 1) * gap;
        return buildRipOutput({ faceH, gap, faceL, yaw, stackMat, stackBaseY, stackTopY });
      }
      if (key === 'optional-finish') {
        [-0.15, 0.15].forEach((x, i) => {
          const half = new THREE.Mesh(
            new THREE.BoxGeometry(STOCK_W / 1000, STRUT_H / 1000, BLANK_LEN / 1000),

      }
      if (key === 'blank') {
        addMaterialsPad(1.15, 1.0);

        blank.position.set(0.05, 0.11, 0);

      if (key === 'leftover') {

        woodTarget.add(makeLabel(leftoverSawdustNote(), new THREE.Vector3(0, -0.08, 0)));
        return `${RAW_STOCK_QTY} · ${leftoverWhlLabel()}`;

      if (key === 'beveled') {
        addMaterialsPad(1.1, 0.9);
        const finished = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.22, 0.18), woodMat);
        finished.position.set(-0.04, 0.13, 0);
        woodTarget.add(finished);
        const bevelEdge = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.22, 0.18), bevelMat);
        bevelEdge.position.set(0.07, 0.13, 0);

        woodTarget.add(makeLabel(`${BEVEL_DEG}° bevel out`, new THREE.Vector3(0.02, -0.08, 0)));
        return `${finLbl} + ${BEVEL_DEG}°`;
      }
      if (key === 'jig') {
        addJig(pA, pB, pC, h, c, false);
        woodTarget.add(makeLabel('arc ∩ = apex', pC.clone().add(new THREE.Vector3(0, 0.08, 0.05))));
        return `base ${fmt(HEX.c)} · arcs ${fmt(HEX.a)}`;
      }
      if (key === 'jig-stops') {
        addJig(pA, pB, pC, h, c, true);
        woodTarget.add(placeStrut(pA, pB, up), placeStrut(pB, pC, up), placeStrut(pC, pA, up));

        woodTarget.add(makeLabel(`${HEX.qty * 2} base ends`, new THREE.Vector3(0, 0.14, h / 2)));
        return `${HEX.base}° base`;
